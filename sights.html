<style>
/* Layout: 暖簾標頭 → 黏性分區篩選 → 依地區分組的大卡片（上方 10 張輪播相框，下方介紹、看點、時間票價、交通） */
:root{
  --paper:#EEF0F4; --surface:#FFFFFF; --ink:#191C2B; --muted:#5A6075; --line:#D6DAE4;
  --ai:#27358A; --ai-soft:#E3E6F5; --kin:#A9780F; --kin-soft:#F6EBCF; --warn:#9A3B1F;
  --display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.7 var(--body)}
a{color:var(--ai)}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}
header.top{padding-block:24px 0;border-bottom:1px solid var(--line);background:var(--surface)}
.noren{display:flex;gap:6px;margin-bottom:12px}
.noren span{width:34px;height:10px;background:var(--ai);border-radius:0 0 3px 3px}
.noren span:nth-child(2n){opacity:.75}
h1{font:900 clamp(26px,4.4vw,38px)/1.2 var(--display);margin:0;letter-spacing:.02em}
.lede{color:var(--muted);margin:6px 0 0;max-width:64ch}
.tabs{display:flex;gap:4px;margin-top:16px;flex-wrap:wrap}
.tabs a{padding:8px 16px;text-decoration:none;color:var(--muted);border:1px solid transparent;border-bottom:0;border-radius:8px 8px 0 0;font-weight:500}
.tabs a[aria-current="page"]{color:var(--ink);background:var(--paper);border-color:var(--line);margin-bottom:-1px}
.filters{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line);padding-block:10px}
.frow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:13.5px var(--body);padding:5px 13px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--ai);background:var(--ai);color:var(--surface);font-weight:700}
.chip .n{font:11px var(--mono);opacity:.75;margin-left:4px}
.search{margin-left:auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:14px var(--body);padding:6px 12px;border-radius:999px;width:220px;max-width:100%}
main{padding-block:16px 48px}
.group{margin-top:26px}
.group>h2{font:900 28px/1.2 var(--display);margin:0 0 4px;display:flex;gap:12px;align-items:baseline}
.group>h2 small{font:500 13px var(--body);color:var(--muted)}
.amap{margin:12px 0 4px;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}.amap a{display:block}.amap img{display:block;width:100%;height:auto}.amap figcaption{padding:8px 12px;font-size:12px;color:var(--muted);line-height:1.5}.amap figcaption b{color:var(--ink);font-weight:700}
.part{margin-top:14px}
.parth{font:900 19px var(--display);margin:0;display:flex;gap:8px;align-items:baseline;color:var(--ai)}
.parth span{font:12px var(--mono);color:var(--muted)}
.area{margin-top:12px}
.area>h3{font:600 16px var(--display);color:var(--muted);margin:0 0 10px;padding-bottom:6px;border-bottom:1px dashed var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr));gap:18px}
.card{scroll-margin-top:120px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0}

.car{position:relative;aspect-ratio:16/10;background:var(--ai-soft);overflow:hidden;max-width:100%;touch-action:pan-y}
.track{display:flex;height:100%;transition:transform .55s ease}
.track figure{flex:0 0 100%;margin:0;height:100%;position:relative}
.track img{width:100%;height:100%;object-fit:cover}
.cap{position:absolute;left:0;right:0;bottom:0;padding:22px 12px 8px;color:#fff;font-size:12.5px;background:linear-gradient(transparent,rgba(0,0,0,.65))}
.cap small{display:block;font-size:10.5px;opacity:.8;word-break:break-all}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:20px;cursor:pointer}
.nav.p{left:8px}.nav.n{right:8px}
.dots{position:absolute;top:8px;right:8px;display:flex;gap:4px;background:rgba(0,0,0,.35);padding:4px 6px;border-radius:999px}
.dots button{width:8px;height:8px;padding:0;border-radius:50%;border:0;background:rgba(255,255,255,.5);cursor:pointer}
.dots button[aria-current="true"]{background:#fff}
.count{position:absolute;top:8px;left:8px;font:600 12px var(--mono);color:#fff;background:rgba(0,0,0,.45);padding:2px 8px;border-radius:999px}
.noimg{height:100%;display:flex;align-items:center;justify-content:center;font:900 26px var(--display);color:var(--ai);
  background:repeating-linear-gradient(135deg,var(--ai-soft) 0 14px,var(--surface) 14px 28px)}

.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.name{font:900 22px/1.3 var(--display);margin:0;word-break:break-word}
.tagline{display:flex;flex-wrap:wrap;gap:6px;font-size:12px}
.tag{padding:1px 8px;border-radius:4px;background:var(--ai-soft);color:var(--ai)}
.tag.book{background:var(--kin-soft);color:var(--kin);font-weight:700}
.intro{margin:0;font-size:14.5px}
.hl{margin:0;padding-left:1.2em;font-size:14px}
dl{margin:0;display:grid;grid-template-columns:3.6em 1fr;gap:3px 10px;font-size:13.5px}
dt{color:var(--muted)} dd{margin:0;min-width:0;word-break:break-word}
details{font-size:13.5px;border-top:1px solid var(--line);padding-top:6px}
details summary{cursor:pointer;color:var(--ai);font-weight:500}
.tkwrap{overflow-x:auto}
.tk{border-collapse:collapse;width:100%;margin-top:6px;min-width:420px}
.tk td,.tk th{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}
.tk th{font-weight:500;color:var(--muted)}
.tk .pr{font:600 12.5px var(--mono);white-space:nowrap}
.tk td:last-child{white-space:nowrap}
a.tel{font:600 13px var(--mono);white-space:nowrap;text-decoration:none;user-select:all}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}
.links a{font-size:13px;text-decoration:none;border:1px solid var(--line);padding:4px 12px;border-radius:999px}
.links a.go{background:var(--ai);border-color:var(--ai);color:var(--surface)}
.empty{color:var(--muted);padding:30px 0}
footer{font-size:12.5px;color:var(--muted);padding-block:0 40px}
@media (max-width:640px){ .search{margin-left:0;width:100%} .group>h2{font-size:24px} }
@media (prefers-reduced-motion:reduce){ .track{transition:none} }

/* ===== 共用版型：旅遊雜誌風（白底大照片、宋體標題、圓角柔影卡片；鈷藍取自 icon 帽子＋暖橘點綴） ===== */
:root{
  --paper:#F5F6F8; --surface:#FFFFFF; --ink:#1E2026; --muted:#676B75; --line:#E4E6EB;
  --ai:#2747C8; --ai-soft:#EEF1FB; --kin:#D9692E; --kin-soft:#FCEEE4; --warn:#B23A2A;
  --display:"Chiron Sung HK","Noto Serif TC","PMingLiU",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --latin:"Playfair Display",Georgia,serif;
  --kick:"Inter","Noto Sans TC",sans-serif;
  --shadow:0 2px 4px rgba(20,25,40,.04),0 10px 30px rgba(20,25,40,.08);
  --shadow-sm:0 1px 2px rgba(20,25,40,.04),0 4px 14px rgba(20,25,40,.06);
  --navh:90px;
  color-scheme:light;
}
@media (max-width:720px){ :root{ --navh:118px } }
html{scroll-padding-top:calc(var(--navh) + 70px)}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.75;letter-spacing:.01em}
a{color:var(--ai);text-underline-offset:3px}

/* ---- 固定導覽列 ---- */
header.site{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.96);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 1px 0 var(--line),0 8px 24px rgba(20,25,40,.05)}

.brand{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ink);flex:none;min-width:0}
.logo{position:relative;width:60px;height:60px;flex:none}
.logo img{position:relative;z-index:1;width:60px;height:60px;border-radius:50%;object-fit:cover;display:block;box-shadow:0 6px 18px rgba(39,71,200,.28);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.logo::after{content:"";position:absolute;inset:0;border-radius:50%;z-index:2;pointer-events:none;
  background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.6) 50%,transparent 62%);background-size:260% 100%;background-position:160% 0;animation:logo-shine 7s ease-in-out infinite}
.brand:hover .logo img,.brand:focus-visible .logo img{transform:rotate(-8deg) scale(1.07)}
@keyframes logo-shine{0%,72%{background-position:160% 0}100%{background-position:-60% 0}}
.brand-t{display:flex;flex-direction:column;line-height:1.15;min-width:0}

nav.sitetabs{display:flex;gap:24px;margin-left:auto;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
nav.sitetabs::-webkit-scrollbar{display:none}
nav.sitetabs a{position:relative;flex:none;padding:10px 0;font:500 15.5px var(--body);color:var(--muted);text-decoration:none;letter-spacing:.04em;transition:color .2s}
nav.sitetabs a:hover{color:var(--ink)}
nav.sitetabs a[aria-current="page"]{color:var(--ink);font-weight:700}
nav.sitetabs a[aria-current="page"]::after{content:"";position:absolute;left:0;right:0;bottom:2px;height:3px;border-radius:3px;background:var(--kin)}
@media (max-width:720px){
  header.site .bar{flex-wrap:wrap;gap:6px 12px;padding-block:10px 0}

}

/* ---- 頁首（雜誌扉頁） ---- */
.hero{padding-block:46px 26px}

/* ---- 篩選列接在導覽列下方 ---- */
.filters,nav.toc{top:var(--navh)!important;background:rgba(245,246,248,.95)!important;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)!important}

/* ---- 卡片與面板：圓角、柔和陰影、無框線 ---- */
.card,.panel,section.sec,.dish,.route,.quick,details.leg{border:0!important;border-radius:16px!important;box-shadow:var(--shadow)!important;background:var(--surface)}

.ph,.car,.noph{border-radius:0!important}

/* ---- 按鈕、標籤：膠囊 ---- */
.chip,.seg,.btn,.links a,.search,.tag,.rv,.lv,.conf,.linepill,.badge{border-radius:999px!important}
select,input{border-radius:10px!important}

.sig{background:var(--kin-soft)!important}
.sig b{color:var(--kin)!important}
.lv.h{background:var(--kin)!important;border-color:var(--kin)!important}

/* ---- 標題字 ---- */
.name,.city>h2,.group>h2,section.sec>h2,.panel>h2,.infotext h3,.dish b,.parth,.area>h3,.area h3,.route h3,.quick h2{font-family:var(--display)!important;letter-spacing:.03em}

.parth{color:var(--ai)!important}

/* ---- 手機 ---- */
@media (max-width:720px){
  .filters,nav.toc{position:static!important}
  .filters .frow{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px}

}

  transition:transform .25s var(--ease),box-shadow .25s var(--ease),border-color .25s var(--ease)}
.card,.panel,.sc,.sgnav a,.tax{border-radius:20px!important}
.sx>details>summary,.pk{border-radius:12px!important}
@media (hover:hover){
  .card:hover,.sc:hover,.sgnav a:hover,.pk:hover{transform:translateY(-3px);box-shadow:var(--shadow)!important;border-color:#D4C6B2!important}
}
.card img,.sc img,.sgnav img{border-radius:14px}

.chip,.seg button,.tags span,.tag{border-radius:8px!important;font-weight:500!important;transition:background .2s var(--ease),color .2s var(--ease),transform .12s var(--ease)}
.chip[aria-pressed="true"],.seg button[aria-pressed="true"],.dsw input:checked+label{background:var(--ink)!important;border-color:var(--ink)!important;color:#FBF8F2!important}
.dsw label{border-radius:8px!important}
.rk,.badge,.conf{border-radius:4px!important}

/* 按鈕：主要＝朱紅實心，其餘文字連結化；按壓回饋 */
.btn,.links a,.links button,.lnk a,.acts a,.acts .mini{border-radius:10px!important;transition:background .2s var(--ease),transform .12s var(--ease),box-shadow .2s var(--ease)}
.btn.primary,.links .go,.sc .links .go{background:var(--ai)!important;border-color:var(--ai)!important;color:#fff!important;box-shadow:0 8px 18px -10px rgba(180,67,42,.7)}
.btn.primary:hover,.links .go:hover{background:#9C3722!important}
button:active,.btn:active,.chip:active,a.go:active,.fc:active{transform:translateY(1px) scale(.98)}
:focus-visible{outline:2px solid var(--ai)!important;outline-offset:2px!important}

/* 數字對齊 */
.tm,.dist,.pr,.o3n,.subt span,.tl td:first-child,.big{font-variant-numeric:tabular-nums}

/* 浮動按鈕 */
.basketfab{background:var(--ink)!important;box-shadow:0 10px 24px -10px rgba(34,29,23,.6)!important;border-radius:14px!important}
.fsfab{background:var(--ai)!important;border-radius:14px!important}
.totop{background:var(--surface)!important;color:var(--ai)!important;border:1px solid var(--line)!important;box-shadow:var(--shadow-sm)!important}

/* 頁尾 */
footer.wrap{color:var(--muted);border-top:1px solid var(--line);padding-block:28px 46px!important}
.filters,nav.toc{background:rgba(243,238,229,.94)!important;border-bottom:1px solid var(--line)!important}
.seg{border-radius:10px!important;overflow:hidden}
.search{border-radius:10px!important;background:var(--surface)!important;border-color:var(--line)!important}


header.site{background:rgba(255,255,255,.9)!important}
.card,.panel,.sc,.sgnav a,.tax{border-radius:12px!important}.sx>details>summary,.pk{border-radius:8px!important}
.btn.primary,.links .go,.sc .links .go{background:#111!important;border-color:#111!important;box-shadow:none!important}
.btn.primary:hover,.links .go:hover{background:#333!important}
.hero .eyebrow{color:var(--muted)!important}.hero .eyebrow::before{display:none}
.hero h1{letter-spacing:-.03em!important}
.tags span,.tag{border-radius:999px!important;font-size:12px!important}
.filters,nav.toc{background:rgba(247,246,243,.95)!important}

.tax{border-top:4px solid var(--warn)!important}

", "tickets": [], "tips": ["也可坐京阪到伏見稲荷站走 5 分"], "trip": null, "access": "京都站 轉 JR・步行約 13 分", "addr": "伏見稻荷大社", "official": "https://inari.jp/", "images": [{"file": "sights-img/fushimiinari/01.jpg", "caption": "綿延不絕的千本鳥居", "credit": "Raita Futo from Tokyo, Japan, CC BY 2.0, https://commons.wikimedia.org/wiki/File:Fushimi_Inari_torii_(51471915702).jpg"}, {"file": "sights-img/fushimiinari/02.jpg", "caption": "朱紅色的樓門", "credit": "Kakidai, CC BY-SA 4.0, https://commons.wikimedia.org/wiki/File:Romon,_Fushimi_Inari-taisha_2022.jpg"}, {"file": "sights-img/fushimiinari/03.jpg", "caption": "大鳥居與樓門", "credit": "Hyppolyte de Saint-Rambert, CC BY-SA 4.0, https://commons.wikimedia.org/wiki/File:Fushimi_Inari_Taisha_torii_et_romon.jpg"}, {"file": "sights-img/fushimiinari/04.jpg", "caption": "刻著奉納者名字的鳥居", "credit": "Luka Peternel, CC BY-SA 4.0, https://commons.wikimedia.org/wiki/File:Fushimi-Inari-Shrine-Senbon-Torii-2016-Luka-Peternel.jpg"}, {"file": "sights-img/fushimiinari/05.jpg", "caption": "林間的小鳥居群", "credit": "Josep M. Gracia, CC BY-SA 4.0, https://commons.wikimedia.org/wiki/File:FUS_-_Torii_gates_among_trees_at_Fushimi_Inari-taisha,_Kyoto,_Japan,_2015.jpg"}, {"file": "sights-img/fushimiinari/06.jpg", "caption": "秋日紅葉與鳥居", "credit": "Raita Futo from Tokyo, Japan, CC BY 2.0, https://commons.wikimedia.org/wiki/File:Fushimi_Inari_Taisha_in_Autumn_(51471915102).jpg"}, {"file": "sights-img/fushimiinari/07.jpg", "caption": "夜晚的大鳥居與樓門", "credit": "DuckMaestro, CC BY-SA 4.0, https://commons.wikimedia.org/wiki/File:2026-06-29_kyoto-fushimi-inari_torii-romon_night.jpg"}, {"file": "sights-img/fushimiinari/08.jpg", "caption": "稻荷山上的鳥居步道", "credit": "そらみみ, CC BY-SA 4.0, https://commons.wikimedia.org/wiki/File:Shrines_on_Mount_Inariyama.jpg"}, {"file": "sights-img/fushimiinari/09.jpg", "caption": "稻荷山頂的石塚（お塚）", "credit": "Guilhem Vellut from Annecy, France, CC BY 2.0, https://commons.wikimedia.org/wiki/File:Summit_of_Mount_Inariyama_@_Fushimi_Inari_Shrine_@_Kyoto_(13406173185).jpg"}, {"fi ", "credit": "先従隗始, CC0, https://commons.wikimedia.org/wiki/File:The_Avenue_of_Metasequoias_20220301_03.jpg"}, {"file": "sights-img/makino/05.jpg", "caption": "元旦雪後的水杉林蔭道（1 月攝）", "credit": "baggio4ever, CC BY 3.0, https://commons.wikimedia.org/wiki/File:南からピックランドに至る道_2011年元日_-_panoramio.jpg"}, {"file": "sights-img/makino/06.jpg", "caption": "枝頭掛滿白雪的水杉並木（1 月攝）", "credit": "baggio4ever, CC BY 3.0, https://commons.wikimedia.org/wiki/File:北からピックランドに至る道_2011年元日_-_panoramio.jpg"}], "book": false, "tel": "0740-27-1811", "tags": ["hidden", "winter"], "ota": [{"site": "Klook", "label": "【冬季限定】箱館山滑雪／玩雪＋水杉林蔭道＋マキノ高原溫泉一日遊（大阪・京都出發）", "url": "https://www.klook.com/zh-TW/activity/177286-one-day-ski-resort-tour-at-hakodateyama-omoide-shiga/"}, {"site": "KKday", "label": "滋賀箱館山滑雪一日遊（含水杉林蔭道、マキノ高原溫泉，大阪・京都出發）", "url": "https://www.kkday.com/zh-tw/product/198106"}]}, {"id": "sasayama", "name": "丹波篠山城下町・篠山城大書院（たんばささやま）", "group": "osaka", "sub": true, "areaLabel": "丹波篠山", "intro": "兵庫縣中東部的丹波篠山，是德川家康為了包圍大阪而築的篠山城城下町，至今保留寬闊的護城河、石垣和復原的「大書院」大型木造建築。城的東邊有茅草屋頂的武家屋敷「安間家」，北邊的河原町是一整排山牆朝街的老商家，被列為重要傳統建造物群保存地區。冬天正是丹波篠山的美食季，名物「牡丹鍋」（山豬肉味噌火鍋）正當令，還有黑豆、栗子做的點心；城下町地勢平坦，很適合全家慢慢散步。", "highlights": ["篠山城跡：石垣、護城河和復原的大書院，天守台上可眺望城下町", "河原町妻入商家群、御徒士町武家屋敷群兩條老街", "冬季名物「牡丹鍋」（山豬肉火鍋）、丹波黑豆甜點", "城下町很平坦，步行就能逛完"], "hours": "篠山城大書院 9:00–17:00（16:30 停止入館）；週一休（遇假日改隔天）、12/25–1/1 休", "fee": "大書院 大人 400 円、高中・大學生 200 円、中小學生 100 円（另有大書院、青山歷史村、武家屋敷安間家史料館等共通券）", "season": "", "tickets": [], "tips": ["2027/2/2（二）–2/6（六）大書院每天開館（週一休）。", "從西九條住處：JR 環狀線到大阪站，轉 JR 寶塚線（福知山線）丹波路快速到篠山口站約 1 小時 10 分，再搭神姬巴士往「篠山營業所」約 15 分（約 340 円）在「二階町」下車，步行約 5–10 分；全程約 1 小時 45 分、約 1,510 円。", "想快一點可搭 JR 特急「こうのとり」，大阪到篠山口約 53 分（要另付特急費約 1,730 円）。", "牡丹鍋多為 2 人份起，冬季週末店家容易客滿，7 人建議先打電話預約；山豬肉有特殊味道，可另點其他料理給小孩。", "大書院要脫鞋，室內很冷；城跡石垣上有少量石階，其餘都是平路，嬰兒車可通行。"], "trip": [{"label": "從大阪（JR 丹波路快速→神姬巴士）", "total_min": 92, "total_price": "約 1,510 円"}, {"label": "從京都（JR 新快速→尼崎轉寶塚線）", "total_min": 123, "total_price": "約 2,320 円"}], "access": "", "addr": "丹波篠山城下町・篠山城大書院", "official": "http useum/"}, {"file": "sights-img/ucccoffee/04.jpg", "caption": "試飲區（テイスティングコーナー）", "credit": "UCCコーヒー博物館公式サイト, https://www.ucc.co.jp/museum/"}, {"file": "sights-img/ucccoffee/05.jpg", "caption": "咖啡酒廊", "credit": "UCCコーヒー博物館公式サイト, https://www.ucc.co.jp/museum/"}, {"file": "sights-img/ucccoffee/06.jpg", "caption": "博物館商店", "credit": "UCCコーヒー博物館公式サイト, https://www.ucc.co.jp/museum/"}], "book": true, "tel": "", "tags": ["new", "winter"], "ota": []}, {"id": "kobescience", "name": "BANDO 神戶青少年科學館（バンドー神戸青少年科学館）", "group": "osaka", "sub": true, "areaLabel": "神戶・港島", "intro": "神戶市立青少年科學館分兩期大規模改裝，2025 年 3 月完成第 1 期、2026 年 3 月 25 日完成第 2 期。改裝後新增日本第一台能親身體驗離心力的巨型裝置，以及介紹人體構造和神戶企業醫療、製造技術的「生命｜産業」展區、做實驗和工作坊用的工作室。好幾層樓的展示室分成物理・化學、情報科學、宇宙與地球等主題，多數都能動手操作；號稱「神戶最接近星空的地方」的天象儀是神戶市內唯一一座，還有天文觀測室。票價便宜、全在室內，冬天帶小孩很適合，旁邊就是 UCC 咖啡博物館。", "highlights": ["天象儀（ドームシアター）：神戶市內唯一，360 度星空節目，部分場次是兒童向", "物理｜化學：力與運動、能量的體驗裝置，2025 年新設可體驗離心力的巨型裝置", "宇宙與地球：「時空ホッパー」「探究のトビラ」等互動裝置", "2026/3 新展區「生命｜産業」：人體構造與神戶企業的醫療、製造技術，另有實驗室、工作室"], "hours": "週一–四 9:30–16:30、週五–日和假日 9:30–19:00（閉館前 30 分停止入館）；週三休館（遇假日改隔天），館內整理日 1/12–14、年底年初 12/29–1/2 休館", "fee": "展示室：大人（18 歲以上）600 円、小・國・高中生 300 円；天象儀另收：大人 400 円、小・國・高中生 200 円", "season": "", "tickets": [], "tips": ["2027/2/2–2/6 期間：2/3（三）休館，其他天開；週五、六開到 19:00。住京都期間 1/29–2/2 中，1/29（五）–2/1（一）、2/2（二）都有開。", "從西九條住處：同 UCC 咖啡博物館，三宮搭ポートライナー到南公園站，步行約 3 分（看到茶色建築就是）。兩館很近，可以排同一天。", "天象儀場次和內容每天不同，到館先看當天時刻表；18:00 以後國中以下要有家長陪同。", "沒有一般停車場；館內有用餐空間（ランチスペース）和休息室，使用規則以官網為準。"], "trip": [{"label": "從大阪（梅田・JR＋ポートライナー）", "total_min": 46, "total_price": "約 670 円"}, {"label": "從京都（京都站・JR 新快速）", "total_min": 71, "total_price": "約 1,360 円"}], "access": "", "addr": "BANDO 神戶青少年科學館", "official": "https://www.kobe-kagakukan.jp/", "images": [{"file": "sights-img/kobescience/01.jpg", "caption": "科學館外觀", "credit": "バンドー神戸青少年科学館公式サイト, https://www.kobe-kagakukan.jp/"}, {"file": "sights-img/kobescience/02.jpg", "caption": "天象儀（ドームシアター）", "credit": "バンドー神戸青少年科学館公式サイト, https://www.kobe-kagakukan.jp/"}, {"file": "sights-img/kobescience/03.jpg", "caption": "物理・化學展示室", "credit": "バンドー神戸青少年科学館公式サイト, https://www.kobe-kagakukan.jp/"}, {"file": "sights-img/kobescience/04.jpg", "caption": "宇宙與地球展示室", "credit": "バンドー神戸青少年科学館公式サイト, https://www.kobe-kagakukan.jp/"}, {"file": "sights-img/kobescience/05.jpg", "caption": "情報科學展示室", "credit": "バンドー神戸青少年科学館公式サイト, https://www.kobe-kagakukan.jp/"}, {"file": "sights-img/kobescience/06.jpg", "caption": "天文觀測室的望遠鏡", "credit": "バンドー神戸青少年科学館公式サイト, https://www.kobe-kagakukan.jp/"}, {"file": "sights-img/kobescience/07.jpg", "caption": "新設展示「萬有引力的法則」影像", "credit": "バンドー神戸青少年科学館公式サイト, https://www.kobe-kagakukan.jp/"}], "book": false, "tel": "078-302-5177", "tags": ["new", "winter"], "ota": []}, {"id": "cupnoodle", "name": "杯麵博物館 大阪池田（カップヌードルミュージアム 大阪池田・安藤百福發明紀念館）", "group": "osaka", "sub": true, "areaLabel": "池田", "intro": "位在大阪北郊池田市，日清食品創辦人安藤百福就是在這裡發明了世界第一包速食麵「雞湯拉麵（チキンラーメン）」。入館免費，最受歡迎的是「マイカップヌードルファクトリー」：先在空杯子上畫圖，再從 4 種湯頭、12 種配料中挑 4 種，做出世界上獨一無二的杯麵帶回家。全館在室內、無障礙，冬天或下雨都適合，從小小孩到長輩都能動手做。", "highlights": ["マイカップヌードルファクトリー：自己彩繪杯子、挑湯頭和 4 種配料，1 份 500 円、約 45 分；不限年齡，當天在館內領整理券（先到先得）", "チキンラーメンファクトリー：揉麵、桿麵、調味到油炸（油炸由工作人員做），親手做雞湯拉麵，小學生以上、約 70 分、要預約；2027/1/30–2/28 期間做的全部是情人節限定「愛心形」", "重現安藤百福研究速食麵的小屋、約 800 種速食麵包裝排成的「インスタントラーメン・トンネル」", "杯麵造型的體感劇場、紀念品店（小雞「ひよこちゃん」周邊、伴手禮拉麵組）"], "hours": "9:30–16:30（入館到 15:30）；每週二休館（遇國定假日改隔天），年底年初 12/28–1/2、設備維修 2027/1/12–1/15 休館", "fee": "入館免費；マイカップヌードル 1 份 500 円；チキンラーメンファクトリー 國中以上 1,200 円、小學生 600 円", "season": "", "tickets": [{"item": "チキンラーメンファクトリー（雞湯拉麵手作體驗）", "price": "國中以上 1,200 円／小學生 600 円", "url": "https://www.cupnoodles-museum.jp/ja/osaka_ikeda/attractions/cr-factory/", "need_booking": true, "note": "體驗日 3 個月前的同一天 10:00 起網路或電話預約（2/3–2/6 的名額已經開放）。每場 48 人，9:40／10:50／12:00／14:00／15:10；2 人一組（請用偶數人數報名），小學 1–3 年級要和國中以上的人同組；學齡前兒童不能參加，嬰兒車、抱著的幼兒也不能進教室。", "tel": "072-751-0825"}, {"item": "マイカップヌードルファクトリー（彩繪杯麵）", "price": "1 份 500 円", "url": "https://www.cupnoodles-museum.jp/ja/osaka_ikeda/attractions/mc-factory/", "need_booking": false, "note": "不能預約；入館後領整理券，選有空位的時段，在會場的自動販賣機買杯子。人多時每人限做 1 份。", "tel": "072-752-3484"}], "tips": ["2027/2/2–2/6 期間：2/2（二）休館，2/3（三）–2/6（六）照常開館（9:30–16:30，15:30 停止入館）。", "從西九條住處：JR 環狀線（往大阪方向）到大阪站約 5 分，步行約 8 分到阪急大阪梅田站，搭阪急寶塚本線急行到池田約 18 分，出站步行約 5 分；全程約 40 分、約 460 円。", "マイカップヌードル的整理券當天發完就沒了，週末、假日常常中午前額滿；平日上午去最穩。學齡前小孩也能畫杯子，大人在旁邊幫忙。", "館內沒有餐廳、不能帶食物進館，午餐在池田站附近解決。館內沒有寄物櫃，大行李要放阪急池田站剪票口外的大型投幣置物櫃。", "全館無障礙、有電梯，輪椅只能借 1 台（先到先借），有授乳室和換尿布台。做好的杯麵 1 個月內吃完；配料有蝦、蟹、花生（咖哩湯頭）等，食物過敏的人先看官網過敏原表。", "可以和 NIFREL／萬博紀念公園排同一天：阪急池田 → 蛍池（2 站）轉大阪單軌電車到萬博記念公園，約 25 分。"], "trip": [{"label": "從大阪（梅田・阪急寶塚線）", "total_min": 26, "total_price": "約 280 円"}], "access": "", "addr": "杯麵博物館 大阪池田", "official": "https://www.cupnoodles-museum.jp/ja/osaka_ikeda/", "images": [{"file": "sights-img/cupnoodle/01.jpg", "caption": "博物館外觀（2024 年）", "credit": "663highland, CC BY-SA 4.0, https://commons.wikimedia.org/wiki/File:240810_Cupnoodles_Museum_Osaka_Ikeda_Ikeda_Osaka_pref_Japan01s3.jpg"}, {"file": "sights-img/cupnoodle/02.jpg", "caption": "入口旁的館名石碑與外牆", "credit": "663highland, CC BY-SA 4.0, https://commons.wikimedia.org/wiki/File:240810_Cupnoodles_Museum_Osaka_Ikeda_Ikeda_Osaka_pref_Japan02s3.jpg"}, {"file": "sights-img/cupnoodle/03.jpg", "caption": "玻璃帷幕的正面入口", "credit": "Tokumeigakarinoaoshima, CC BY-SA 4.0, https://commons.wikimedia.org/wiki/File:CUPNOODLES_MUSEUM_Osaka_Ikeda.jpg"}, {"file": "sights-img/cupnoodle/05.jpg", "caption": "熱縮膜包裝機，完成後裝進氣墊袋帶回家", "credit": "Mr.ちゅらさん, CC BY-SA 4.0, https://commons.wikimedia.org/wiki/File:CupNoodle_Factory_(1).jpg"}, {"file": "sights-img/cupnoodle/06.jpg", "caption": "重現安藤百福發明雞湯拉麵的研究小屋", "credit": "Tokumeigakarinoaoshima, CC BY-SA 4.0, https://commons.wikimedia.org/wiki/File:The_replica_of_the_hut_for_researching_noodles_by_Momofuku_Ando.jpg"}, {"file": "sights-img/cupnoodle/07.jpg", "caption": "小雞「ひよこちゃん」布偶堆成的金字塔", "credit": "Mr.ちゅらさん, CC BY-SA 4.0, https://commons.wikimedia.org/wiki/File:Hiyoko-chan.jpg"}, {"file": "sights-img/cupnoodle/08.jpg", "caption": "剖開的巨型杯麵模型", "credit": "chee.hong, CC BY 2.0, https://commons.wikimedia.org/wiki/File:Momofuku_Ando_Instant_Ramen_Museum_(11369666834).jpg"}], "book": true, "tel": "072-752-3484", "tags": ["winter"], "ota": []}, {"id": "nifrel", "name": "NIFREL（ニフレル）＋EXPOCITY", "group": "osaka", "sub": true, "areaLabel": "吹田・萬博公園", "intro": "海遊館經營的「活的博物館」，在萬博紀念公園旁的大型購物中心 EXPOCITY 裡。不照魚類、動物分區，而是按照「顏色」「隱身」「動作」「水邊」等主題展示：白老虎、河馬就在玻璃另一邊，狐猴和鳥會在走道旁自由走動、飛過。全在室內，冬天也舒服；隔壁有日本最高的摩天輪和購物中心，過天橋就是太陽之塔和萬博紀念公園的梅林。", "highlights": ["「いろにふれる」色彩繽紛的魚、「かくれる」擬態生物、「みずべにふれる」白老虎、河馬等大型動物", "「うごきにふれる」：環尾狐猴、鳥類在身邊走動、飛過（不能摸）；2026 年 3 月新增「どくにふれる」毒生物區", "「WONDER MOMENTS」：球體和地板投影的光影藝術空間（約 20 分一輪）", "EXPOCITY：ららぽーと購物中心（餐廳多、雨天備案）、高 123 m 的 Redhorse OSAKA WHEEL 摩天輪；過天橋就是萬博紀念公園（太陽之塔、自然文化園梅林）"], "hours": "10:00–18:00（最後入館 17:00；週末、假日時間可能調整，以官網行事曆為準）；原則無休，每年 1 次設備檢修休館（日期待確認）", "fee": "大人（16 歲以上）2,400 円、小學・國中生 1,200 円、3 歲以上幼兒 700 円，2 歲以下免費；萬博公園エリアパス（NIFREL＋萬博紀念公園自然文化園・日本庭園）大人 2,700 円、小學・國中生 1,650 円", "season": "", "tickets": [{"item": "NIFREL 入館券（Web 日時指定票）", "price": "大人 2,400 円／小學・國中 1,200 円／幼兒 700 円", "url": "https://www.nifrel.jp/guide/webticket.html", "need_booking": false, "note": "來館日 30 天前開賣 Web 票（信用卡或 PayPay，要註冊會員）；現場也賣當日的入館時間指定票，週六日每 15 分鐘限量，可能要等。當天可再入館（閉館 1 小時前以前）。", "tel": "0570-022060"}, {"item": "萬博公園エリアパス（NIFREL＋萬博紀念公園）", "price": "大人 2,700 円／小學・國中 1,650 円", "url": "https://www.nifrel.jp/eventnews/2026/04/1-9.html", "need_booking": false, "note": "販售到 2027/3/31；在 Discover OSAKA 網站或便利商店機台買，NIFREL 窗口不賣，不用指定入館時間。萬博紀念公園週三休園，週三去就不划算。", "tel": ""}], "tips": ["2027/2/2–2/6 期間 NIFREL 每天開館（年度設備檢修日待確認）；旁邊的萬博紀念公園每週三休園，2/3（三）公園和太陽之塔都不開。", "萬博紀念公園的梅林（自然文化園＋日本庭園，約 140 種、680 棵）：2026 年梅まつり是 2/7–3/8，2027 年日期待確認；2/2–2/6 多半還在梅まつり開始前，只有早開的品種在開。太陽之塔內部參觀要事先上網預約。", "從西九條住處：JR 環狀線到大阪站，步行到阪急大阪梅田搭寶塚本線急行到蛍池，轉大阪單軌電車到萬博記念公園，約 55 分、約 800 円；或從梅田搭御堂筋線（直通北大阪急行）到千里中央轉單軌，約 810 円。出站左轉走約 2 分就到。", "看完約 1.5–2.5 小時；平日 15:00 以後人比較少。館內不能帶外食、也沒有販賣機（可帶有蓋水壺），有咖啡廳。", "NIFREL 不借輪椅和嬰兒車，要在ららぽーと EXPOCITY 服務台借；館內有電梯、授乳室、換尿布台，有嬰兒車停放處。1 樓有投幣置物櫃，行李箱不能帶進館。", "可以和杯麵博物館（池田）排同一天：大阪單軌電車萬博記念公園 → 蛍池，轉阪急到池田，約 25 分。"], "trip": [{"label": "從大阪（梅田・北大阪急行＋大阪單軌電車）", "total_min": 36, "total_price": "約 630 円"}], "access": "", "addr": "NIFREL", "official": "https://www.nifrel.jp/", "images": [{"file": "sights-img/nifrel/01.jpg", "caption": "NIFREL 白色外觀與後方的 Redhorse 摩天輪", "credit": "Dick Thomas Johnson, CC BY 2.0, https://commons.wikimedia.org/wiki/File:Nifrel,_Expocity,_Suita,_Osaka_-_Apr_12,_2019.jpg"}, {"file": "sights-img/nifrel/02.jpg", "caption": "星空般燈光下的水槽展區", "credit": "MIKI Yoshihito, CC BY 2.0, https://commons.wikimedia.org/wiki/File:NIFREL._(33079838724).jpg"}, {"file": "sights-img/nifrel/03.jpg", "caption": "環尾狐猴", "credit": "pelican, CC BY-SA 2.0, https://commons.wikimedia.org/wiki/File:Nifrel,_Osaka,_Japan_(24699507224).jpg"}, {"file": "sights-img/nifrel/04.jpg", "caption": "白老虎", "credit": "Totti, CC BY-SA 4.0, https://commons.wikimedia.org/wiki/File:Nifrel_White_Tiger.jpg"}, {"file": "sights-img/nifrel/05.jpg", "caption": "「WONDER MOMENTS」球體光影藝術", "credit": "MIKI Yoshihito, CC BY 2.0, https://commons.wikimedia.org/wiki/File:NIFREL._(33766368562).jpg"}, {"file": "sights-img/nifrel/06.jpg", "caption": "刺魨", "credit": "Totti, CC BY-SA 4.0, https://commons.wikimedia.org/wiki/File:Diodon_liturosus_Nifrel1.jpg"}, {"file": "sights-img/nifrel/07.jpg", "caption": "維多利亞冠鴿", "credit": "MIKI Yoshihito, CC BY 2.0, https://commons.wikimedia.org/wiki/File:NIFREL._(33079947634).jpg"}, {"file": "sights-img/nifrel/08.jpg", "caption": "EXPOCITY 的 Redhorse OSAKA WHEEL 摩天輪", "credit": "Tokumeigakarinoaoshima, CC BY-SA 4.0, https://commons.wikimedia.org/wiki/File:Redhorse_OSAKA_WHEEL.jpg"}], "book": false, "tel": "0570-022060", "tags": ["winter"], "ota": [{"site": "Klook", "label": "NIFREL 門票", "url": "https://www.klook.com/zh-TW/activity/13116-nifrel-interactive-aquazoo-eticket-osaka/"}, {"site": "KKday", "label": "NIFREL 門票", "url": "https://www.kkday.com/zh-tw/product/19697-nifrel-aqua-zoo-admission-ticket-osaka-japan"}]}, {"id": "anpankobe", "name": "神戶麵包超人兒童博物館＆購物中心（神戸アンパンマンこどもミュージアム&モール）", "group": "osaka", "sub": true, "areaLabel": "神戶・ハーバーランド", "intro": "神戶港邊ハーバーランド的麵包超人主題館。2 樓是付費的博物館，有果醬爺爺的麵包工廠、細菌人基地「バイキンひみつ基地」、可以爬上爬下的場景和角色表演舞台；1 樓購物中心免費進入，有限定周邊和角色造型麵包店。全在室內，最適合 1–6 歲的小朋友，冬天、下雨都能玩。", "highlights": ["2 樓博物館：果醬爺爺的麵包工廠、細菌人基地等場景，可以鑽、可以爬、可以玩扮家家酒", "每天多場角色表演和「アンパンマンといっしょにたいそう」（體操），舞台要拿「デジタル整理券」", "「バイキンひみつ基地」：細菌人主題的遊戲區，憑博物館門票當天隨時可進", "1 樓免費購物中心：ジャムおじさんのパン工場（角色造型麵包）、神戶限定周邊和餐廳"], "hours": "10:00–17:00（博物館最後入館 16:00）；2027 年休業日：1/1–1/2、2/1（一）–2/2（二）、3/9（二）", "fee": "博物館：1 歲以上大人小孩同價 2,000–2,500 円（依日期浮動，未滿 1 歲免費）；1 樓購物中心免費", "season": "", "tickets": [{"item": "博物館 日時指定 WEB 票", "price": "1 歲以上 2,000–2,500 円（依日期浮動）", "url": "https://www.kobe-anpanman.jp/guide/", "need_booking": true, "note": "官網說明原則要事先在アソビュー！買日時指定票，來館日 28 天前 10:00 開賣；價格依官網價格行事曆分 2,000／2,200／2,500 円三級。", "tel": "078-341-8855"}], "tips": ["2027/2/2–2/6 期間：2/1（一）–2/2（二）設備維修休業，2/3（三）–2/6（六）照常 10:00–17:00。", "從西九條住處：JR 環狀線到大阪站轉 JR 神戶線新快速到神戶站（約 37 分、約 660 円），走デュオこうべ地下街往海側、25・26 號出口上地面，步行約 8 分；或阪神なんば線直達神戸三宮（約 40 分）再轉 JR 到神戶站。", "2 樓博物館和バイキンひみつ基地不能推嬰兒車（售票處旁有嬰兒車停放處），建議帶背帶；1 樓購物中心可以推嬰兒車。", "2 樓有育嬰室（換尿布台、泡奶熱水機、授乳空間），1 樓ベビーステーション還有微波爐可加熱副食品；每間廁所都有兒童馬桶。", "國中以上的大人和小孩同價；不需要陪玩的長輩可以留在 1 樓購物中心或隔壁 umie、港邊散步。和神戶動物王國、神戶光之饗宴（1/29–2/7）排成神戶一日遊很順。"], "trip": [{"label": "從大阪（梅田・JR 新快速）", "total_min": 34, "total_price": "約 460 円"}], "access": "", "addr": "神戶麵包超人兒童博物館＆購物中心", "official": "https://www.kobe-anpanman.jp/", "images": [{"file": "sights-img/anpankobe/01.jpg", "caption": "ハーバーランドの博物館外觀", "credit": "663highland, CC BY 2.5, https://commons.wikimedia.org/wiki/File:130720_Kobe_Anpanman_Children's_Museum_&_Mall_Kobe_Japan01s3.jpg"}, {"file": "sights-img/anpankobe/02.jpg", "caption": "2 樓博物館區", "credit": "官網：神戸アンパンマンこどもミュージアム&モール https://www.kobe-anpanman.jp/about/"}, {"file": "sights-img/anpankobe/03.jpg", "caption": "果醬爺爺的麵包工廠", "credit": "官網：神戸アンパンマンこどもミュージアム&モール https://www.kobe-anpanman.jp/about/"}, {"file": "sights-img/anpankobe/04.jpg", "caption": "細菌人基地「バイキンひみつ基地」", "credit": "官網：神戸アンパンマンこどもミュージアム&モール https://www.kobe-anpanman.jp/about/"}, {"file": "sights-img/anpankobe/05.jpg", "caption": "角色表演舞台", "credit": "官網：神戸アンパンマンこどもミュージアム&モール https://www.kobe-anpanman.jp/about/"}, {"file": "sights-img/anpankobe/06.jpg", "caption": "ジャムおじさんのパン工場的角色造型麵包", "credit": "官網：神戸アンパンマンこどもミュージアム&モール https://www.kobe-anpanman.jp/about/"}, {"file": "sights-img/anpankobe/07.jpg", "caption": "1 樓免費入場的購物中心", "credit": "官網：神戸アンパンマンこどもミュージアム&モール https://www.kobe-anpanman.jp/about/"}, {"file": "sights-img/anpankobe/08.jpg", "caption": "冬天的博物館外觀（2014 年 2 月）", "credit": "Mti, CC BY-SA 3.0, https://commons.wikimedia.org/wiki/File:Kobe_Anpanman_Children's_Museum_&_Mall_in_2014-2-22_No,1.JPG"}], "book": true, "tel": "078-341-8855", "tags": ["winter"], "ota": []}, {"id": "naritasan", "name": "成田山不動尊 節分祭（成田山大阪別院 明王院・なりたさんふどうそん）", "group": "osaka", "sub": true, "areaLabel": "寢屋川・香里園", "intro": "千葉成田山新勝寺在關西唯一的別院，以「交通安全祈願」聞名，京阪電車每節車廂都掛著這裡的護符。每年節分（2027 年是 2/3 週三）舉行關西規模最大的撒豆儀式：境內搭起全長 150 m 的舞台，中央放日本最大的「千升大福枡」，藝人、運動選手和政商名人當「年男」上台撒福豆。這裡只喊「福は内」、不喊「鬼は外」——因為不動明王慈悲，連鬼都會悔改。剛好碰上住大阪期間，可以體驗最道地的日本節分。", "highlights": ["節分祭撒豆（2/3）：10:30 追儺豆まき式（受邀名人）、12:00、13:00、14:00、15:00 各一場，在境內特設舞台，觀看、接福豆免費", "「招福豆まき式」（12:00、14:00）一般人也能穿陣羽織上台撒豆，參加費 3,000 円，要先打電話預約", "朱紅色本堂、山門與奧之院隧道；全國第一個專門為汽車祈福的「交通安全祈禱殿」", "節分隔天（立春）起有「星まつり」（7 天）和「厄除け祈願大祭」（到 2 月底）"], "hours": "境內（山門）全年開放；授與所平常 6:00–17:00。節分祭 2027/2/3（三）：撒豆 10:30（限受邀者）、12:00、13:00、14:00、15:00", "fee": "參拜、觀看撒豆免費；招福豆まき式上台撒豆 3,000 円（附福豆）；追儺豆まき式 50,000 円", "season": "", "tickets": [{"item": "招福豆まき式（上台撒豆）", "price": "3,000 円", "url": "https://osaka-naritasan.or.jp/event/%e7%af%80%e5%88%86%e7%a5%ad/", "need_booking": true, "note": "參加資格不限（不分生肖、厄年），要事先打電話給信徒部預約，只能用日語；小孩能不能上台、名額多少請電話確認（待確認）。10:30 那場的撒豆役只限受邀者。", "tel": "072-833-8881"}], "tips": ["2027 年節分是 2/3（三），剛好在住大阪期間；這天排的是 USJ，若有家人不去 USJ，可以把這裡排進來。節分以外的日子一樣能參拜，但沒有撒豆活動。", "撒豆時人潮非常擁擠、大家搶福豆，長輩和小小孩不要擠到舞台正前方，在後面看就好；掉在地上的福豆不要彎腰去撿，避免被推擠踩到。", "從西九條住處：JR 環狀線到京橋（約 14 分），轉京阪本線（準急／區間急行）到香里園（約 16–20 分），出站上坡步行約 15 分，或搭京阪巴士 1 號乘車處（往三井団地・ビバモール）到「成田山不動尊前」；全程約 50 分、約 560 円。京阪特急不停香里園。", "節分當天附近道路可能有交通管制、計程車不好叫（待確認），不建議開車。", "大阪是節分吃「恵方巻」（長條壽司捲）的發源地：2/3 當天超市、便利商店、百貨地下街都有賣，晚上全家朝當年的吉利方位（2027 年是「北北西」）不說話吃完一整條，很好玩。"], "trip": [{"label": "從大阪（淀屋橋・京阪電車）", "total_min": 38, "total_price": "約 400 円"}], "access": "", "addr": "成田山不動尊 節分祭", "official": "https://osaka-naritasan.or.jp/", "images": [{"file": "sights-img/naritasan/01.jpg", "caption": "山門", "credit": "KENPEI, CC BY-SA 3.0, https://commons.wikimedia.org/wiki/File:Naritasan_Osaka_betsuin_Myooin_sanmon.jpg"}, {"file": "sights-img/naritasan/02.jpg", "caption": "本堂", "credit": "KENPEI, CC BY-SA 3.0, https://commons.wikimedia.org/wiki/File:Naritasan_Osaka_betsuin_Myooin_hondo1.jpg"}, {"file": "sights-img/naritasan/03.jpg", "caption": "本堂與香爐", "credit": "KENPEI, CC BY-SA 3.0, https://commons.wikimedia.org/wiki/File:Naritasan_Osaka_betsuin_Myooin_hondo2.jpg"}, {"file": "sights-img/naritasan/04.jpg", "caption": "冬天的本堂", "credit": "山中紘治, CC BY 2.1 jp, https://commons.wikimedia.org/wiki/File:Naritasanhudoson.jpg"}, {"file": "sights-img/naritasan/05.jpg", "caption": "新年期間的本堂", "credit": "＋－, CC BY-SA 3.0, https://commons.wikimedia.org/wiki/File:成田不動尊本堂.jpg"}, {"file": "sights-img/naritasan/06.jpg", "caption": "專為汽車祈福的交通安全祈禱殿", "credit": "KENPEI, CC BY-SA 3.0, https://commons.wikimedia.org/wiki/File:Naritasan_Osaka_betsuin_Myooin_kitosho.jpg"}, {"file": "sights-img/naritasan/07.jpg", "caption": "奧之院入口的隧道", "credit": "＋－, CC BY-SA 3.0, https://commons.wikimedia.org/wiki/File:成田山不動尊奥の院.jpg"}], "book": true, "tel": "072-833-8881", "tags": ["winter"], "ota": []}, {"id": "luminarie", "name": "神戶光之饗宴（神戸ルミナリエ・第 32 回）", "group": "osaka", "sub": true, "areaLabel": "神戶・三宮", "intro": "為悼念 1995 年阪神・淡路大地震罹難者而開始的燈飾活動，以義大利風格的巨大拱門燈飾聞名。2024 年起改在 1 月底到 2 月初舉辦，2027 年第 32 回的會期是 1/29（五）–2/7（日），剛好涵蓋全家住大阪的 2/2–2/6。會場分成メリケンパーク（主作品，部分收費）、東遊園地和舊居留地（免費），每天傍晚點燈到 21:30。", "highlights": ["メリケンパーク會場（有料區）：高約 17 m、寬約 53 m 的玄關作品「フロントーネ」和長約 81 m 的光之迴廊「ガレリア」，2027 年主題「港に灯る、千のしらべ」", "東遊園地會場（免費）：高約 23 m 的光之聖塔「スクルトゥーラ」，旁邊花時計廣場有美食攤和音樂舞台「KOBE ディライト・ファウンテン」", "舊居留地會場（免費）：三井住友銀行前廣場的箱型作品，播放震災復興之歌「しあわせ運べるように」", "メリケンパーク有約 20 台餐車，可以邊吃熱食邊看燈；ハーバーランド umie、神戶煉瓦倉庫、大丸神戶店前也有小作品"], "hours": "2027/1/29（五）–2/7（日）每天傍晚（薄暮）點燈到 21:30；點燈時間當天現場決定", "fee": "東遊園地、舊居留地免費；メリケンパーク有料區：前售票 平日 500 円／週六日 750 円，當日票 平日 1,000 円／週六日 1,500 円；小學生以下免費（要家長陪同）", "season": "", "tickets": [{"item": "メリケンパーク會場 有料區 日時指定特別鑑賞券", "price": "前售 平日 500 円／週六日 750 円（當日 1,000／1,500 円）", "url": "https://kobe-luminarie.jp/ticket/", "need_booking": true, "note": "要選入場時段，不能提早進、遲到可能不能進，進場後可待到熄燈；買了不能改期或退票。網路（アソビュー！、イープラス、ローチケ、KANSAI MaaS 等）或 7-11、全家、Lawson 機台都能買；當日票 15:00 起在會場賣，但前售賣完可能不賣。小學生以下免費。", "tel": "0570-200-883"}], "tips": ["2/2–2/6 每天都有點燈：2/2（二）–2/5（五）是平日，人比週末少，有料區也比較便宜（前售 500 円）；2/6（六）是週末，人最多。", "從西九條住處：阪神なんば線快速急行（往神戸三宮）直達神戸三宮，約 40 分、約 320 円；往南走約 10 分到東遊園地，再走約 15 分到メリケンパーク。回程從元町或神戸三宮搭阪神回西九條約 40 分。", "三個會場之間都要走路（全部逛完約 3 小時），長輩可以只看東遊園地＋メリケンパーク，中間搭計程車；會場內輪椅可通行，東遊園地和メリケンパーク服務處有少量輪椅可借。", "會場不能帶行李箱、也沒有寄物櫃；晚上海邊風大很冷，要穿暖、帶暖暖包。有料區裡面沒有廁所，進場前先上。", "遇到大雨、大雪、暴風等警報可能停辦，當天 13:00 前後看官網公告。白天可以先去神戶動物王國或麵包超人博物館，傍晚看燈，排成神戶一日遊。"], "trip": [{"label": "從大阪（梅田・JR 新快速）", "total_min": 32, "total_price": "約 420 円"}], "access": "", "addr": "神戶光之饗宴", "official": "https://kobe-luminarie.jp/", "images": [{"file": "sights-img/luminarie/01.jpg", "caption": "第 30 回（2025 年 1 月）的燈飾拱門", "credit": "Yoyogimura, CC BY-SA 4.0, https://commons.wikimedia.org/wiki/File:第30回神戸ルミナリエ(1).jpg"}, {"file": "sights-img/luminarie/02.jpg", "caption": "第 30 回的燈飾作品", "credit": "Yoyogimura, CC BY-SA 4.0, https://commons.wikimedia.org/wiki/File:第30回神戸ルミナリエ(2).jpg"}, {"file": "sights-img/luminarie/03.jpg", "caption": "從高處俯瞰東遊園地會場（2012 年）", "credit": "Takeshi Kuboki, CC BY 2.0, https://commons.wikimedia.org/wiki/File:神戸ルミナリエ_(8274124111).jpg"}, {"file": "sights-img/luminarie/04.jpg", "caption": "會場內的噴水池與燈飾（2017 年）", "credit": "lasta29, CC BY 2.0, https://commons.wikimedia.org/wiki/File:Kobe_Luminarie_2017_(25372159798).jpg"}, {"file": "sights-img/luminarie/05.jpg", "caption": "白天的メリケンパーク會場作品骨架（2024 年 1 月）", "credit": "Hyppolyte de Saint-Rambert, CC BY 4.0, https://commons.wikimedia.org/wiki/File:Kobe_hdsr_in_city_S5_22.jpg"}], "book": true, "tel": "0570-200-883", "tags": ["winter"], "ota": []}, {"id": "kobeoukoku", "name": "神戶動物王國（神戸どうぶつ王国）", "group": "osaka", "sub": true, "areaLabel": "神戶・ポートアイランド", "intro": "位在神戶港人工島的「花與動物與人共生」主題園，大部分區域在溫室般的室內，冬天也溫暖明亮。最有名的是幾乎一動也不動的鯨頭鸛（ハシビロコウ），還有兔猻、小熊貓、水豚、企鵝等上百種動物，很多可以餵食、近距離接觸。地面平坦、可以借輪椅，長輩小孩都好逛，從三宮搭ポートライナー約 15 分、出站就到。", "highlights": ["室內花園「フラワーシャワー」：滿室吊掛的花卉和大睡蓮池，冬天也是一片花海（品種依季節而異）", "人氣明星：鯨頭鸛生態園「Big bill」、兔猻（マヌルネコ）、小熊貓、コビトカバ等", "餵食與接觸：水豚、羊駝、羊、陸龜可以餵，企鵝點心、貓頭鷹站手臂、貓狗兔「ワンタッチ・ニャンタッチ」（多數另收費）", "鳥類自由飛行秀「Wings」、狗狗運動表演「Buddy」（戶外，天候不佳可能取消）"], "hours": "10:00–17:00；冬季每週四休園（依官網到 2027 年 1 月的行事曆），2027 年 2 月行事曆尚未公布", "fee": "大人（國中以上）2,400 円、65 歲以上 1,900 円、小學生 1,200 円、4–5 歲 500 円，3 歲以下免費；餵食、接觸體驗另收費", "season": "", "tickets": [{"item": "入園券（現場／Web／ポートライナー套票）", "price": "大人 2,400 円／65 歲以上 1,900 円／小學生 1,200 円／4–5 歲 500 円", "url": "https://www.kobe-oukoku.com/information/fees", "need_booking": false, "note": "現場窗口可買。官網有「ポートライナーセット券」「阪神電車・ポートライナーセット券」（車票＋入園券），搭電車去可比較是否划算（價格待確認）。65 歲以上要出示年齡證明（護照）。", "tel": "078-302-8899"}], "tips": ["2027/2/2–2/6 期間：照往年冬季規律，2/4（四）應該休園，2/2、2/3、2/5、2/6 開園（10:00–17:00）；2 月行事曆公布後要再確認。", "從西九條住處：阪神なんば線快速急行直達神戸三宮（約 40 分、約 320 円），或 JR 環狀線轉大阪站新快速到三ノ宮（約 35 分）；三宮轉ポートライナー（往神戸空港）到「計算科学センター」站約 15 分、290 円，出站就是北入口。全程約 1 小時。", "大部分在室內，雨天、冷天都適合；週末人多。輪椅免費借、嬰兒車租借 500 円（還車退 100 円），都不能預約；有授乳室，園內餐廳都能要泡奶熱水。", "可以帶便當進園（座位有限），園內也有餐廳和麵店；不能帶三輪車、滑板車。逛完約 2–3 小時，不能再入園。", "下午可以接著去ハーバーランド的麵包超人博物館，傍晚看神戶光之饗宴（1/29–2/7），排成神戶一日遊。"], "trip": [{"label": "從大阪（梅田・JR＋ポートライナー）", "total_min": 44, "total_price": "約 710 円"}], "access": "", "addr": "神戶動物王國", "official": "https://www.kobe-oukoku.com/", "images": [{"file": "sights-img/kobeoukoku/01.jpg", "caption": "室內花園「フラワーシャワー」的步道", "credit": "Hyppolyte de Saint-Rambert, CC BY 4.0, https://commons.wikimedia.org/wiki/File:Animal_Kingdom_Kobe_Port_Island_hdsr_S5_02.jpg"}, {"file": "sights-img/kobeoukoku/02.jpg", "caption": "溫室裡的睡蓮池", "credit": "Hyppolyte de Saint-Rambert, CC BY 4.0, https://commons.wikimedia.org/wiki/File:Animal_Kingdom_Kobe_Port_Island_hdsr_S5_10.jpg"}, {"file": "sights-img/kobeoukoku/03.jpg", "caption": "招牌明星鯨頭鸛（ハシビロコウ）", "credit": "Hyppolyte de Saint-Rambert, CC BY 4.0, https://commons.wikimedia.org/wiki/File:Balaeniceps_rex_(Shoebill)_Animal_Kingdom_Kobe_hdsr_S5_01.jpg"}, {"file": "sights-img/kobeoukoku/04.jpg", "caption": "兔猻（マヌルネコ）", "credit": "Hyppolyte de Saint-Rambert, CC BY 4.0, https://commons.wikimedia.org/wiki/File:Otocolobus_manul_(_Felis_manul)_Kobe_Animal_Kingdom_hdsr_S5_02.jpg"}, {"file": "sights-img/kobeoukoku/05.jpg", "caption": "環尾狐猴", "credit": "Hyppolyte de Saint-Rambert, CC BY 4.0, https://commons.wikimedia.org/wiki/File:Lemur_catta_(Maki_catta)_Kobe_animal_kingdom_hdsr_S5_04.jpg"}, {"file": "sights-img/kobeoukoku/06.jpg", "caption": "巨嘴鳥", "credit": "pelican, CC BY-SA 2.0, https://commons.wikimedia.org/wiki/File:Kobe_Animal_Kingdom,_Kobe,_Japan_(16756044674).jpg"}, {"file": "sights-img/kobeoukoku/07.jpg", "caption": "可以近距離看的兔子", "credit": "Hyppolyte de Saint-Rambert, CC BY 4.0, https://commons.wikimedia.org/wiki/File:Angora_rabbit_in_Kobe_Animal_Kingdom_(Port_Island-Chuo-Ku)_03.jpg"}, {"file": "sights-img/kobeoukoku/08.jpg", "caption": "小食蟻獸", "credit": "Hyppolyte de Saint-Rambert, CC BY 4.0, https://commons.wikimedia.org/wiki/File:Animal_Kingdom_Kobe_Port_Island_hdsr_S5_01.jpg"}], "book": false, "tel": "078-302-8899", "tags": ["winter"], "ota": [{"site": "Klook", "label": "神戶動物王國門票", "url": "https://www.klook.com/zh-TW/activity/33264-kobe-animal-kingdom-ticket/"}, {"site": "KKday", "label": "神戶動物王國門票", "url": "https://www.kkday.com/zh-tw/product/161046-kobe-animal-kingdom-admission-ticket-japan"}]}, {"id": "chazuna", "name": "茶づな（お茶と宇治のまち歴史公園）", "group": "kyoto", "sub": true, "areaLabel": "宇治", "intro": "宇治市在宇治川東岸、京阪宇治站旁蓋的「お茶與宇治城鎮歷史公園」，主館「茶づな」裡有介紹宇治茶歷史與製法的博物館，用展示和影片說明茶從種植、採摘到變成抹茶的過程，小朋友也看得懂。館內每天有不同的體驗活動，最受歡迎的是用石臼親手把茶葉磨成抹茶 a", "sub": true, "areaLabel": "神戶・六甲山", "intro": "神戶六甲山上的滑雪、玩雪場，從大阪市區約 1 小時半就到，是離大阪最近的雪地。不滑雪也能去：「スノーランド」是雪橇和玩雪專用區，有適合小小孩的緩坡、打雪球的標靶區，雪橇、雪衣、雪靴都能現場租。雪是人工造雪加天然雪，1 月底–2 月初是整季最冷、雪況最穩的時候。玩完可以搭六甲山上巴士到「六甲ガーデンテラス」看大阪灣，或搭六甲有馬纜車下到有馬溫泉。", "highlights": ["「スノーランド」：雪橇、堆雪人、雪球打靶，不用會滑雪", "初學者緩坡與滑雪、單板學校（有未就學兒專用課程）", "雪橇、雪衣、雪靴、手套都能租，空手去也行", "同在山上：六甲ガーデンテラス展望台、六甲有馬纜車到有馬溫泉"], "hours": "2026/12/5–2027/3/7 營業；平日 9:00–17:00、週末假日（土日祝扱い日）9:00–20:00（入園券售票到平日 16:30）", "fee": "入園券 大人（國中以上）2,800 円、兒童（3 歲–小學）1,400 円；吊椅 1 日券平日 1,600 円；雪橇、雪衣另租（約 1,000–2,000 円／件，待確認）", "season": "", "tickets": [{"item": "六甲山スノーパーク 入園券", "price": "大人 2,800 円／兒童（3 歲–小學）1,400 円", "url": "https://www.rokkosan.com/ski/fee/", "need_booking": false, "note": "現場買即可；只玩雪也要買入園券（吊椅另購）。官網有「交通＋入園券」的優惠套票，Klook 也有入園券與雪具租借組合、從大阪出發的玩雪一日遊。", "tel": "078-891-0366"}], "tips": ["2027/2/2–2/6 在營業期間內，每天營業（積雪、天候狀況每天早上 8:30 左右更新在官網首頁）。", "從西九條住處：JR 環狀線到大阪，轉 JR 神戸線到六甲道（約 30 分），搭神戶市巴士 16 系統到六甲ケーブル下（約 15 分），搭六甲纜車上山（10 分、800 円），再轉六甲山上巴士到「スノーパーク前」；全程約 1 小時 40 分。", "山上比市區低 5–6 度，常在 0 度以下：防水手套、毛帽、雪靴（可租）、替換襪子都要準備；小孩容易濕透，帶一套換洗衣服。", "有室內休息區和餐廳；不玩雪的長輩可以在餐廳或六甲ガーデンテラス的室內咖啡廳等。", "纜車、山上巴士在強風時可能停駛；回程最後班次比雪場關門早，下午 4 點前開始往回走比較穩。"], "trip": [{"label": "從大阪（阪急六甲＋巴士＋六甲纜車）", "total_min": 66, "total_price": "約 1,360 円＋山上巴士"}, {"label": "從京都（JR 六甲道＋巴士＋六甲纜車）", "total_min": 96, "total_price": "約 2,140 円＋山上巴士"}], "access": "", "addr": "六甲山雪樂園", "official": "https://www.rokkosan.com/ski/", "images": [{"file": "sights-img/rokkosnow/01.jpg", "caption": "六甲山スノーパーク入口（雪季）", "credit": "Feel KOBE（神戸公式観光サイト）, 官方觀光網站照片, https://www.feel-kobe.jp/column/winter-sport/"}, {"file": "sights-img/rokkosnow/02.jpg", "caption": "初學者用的緩坡滑雪道（雪季）", "credit": "Feel KOBE（神戸公式観光サイト）, 官方觀光網站照片, https://www.feel-kobe.jp/column/winter-sport/"}, {"file": "sights-img/rokkosnow/03.jpg", "caption": "「スノーランド」的雪橇專用坡（雪季）", "credit": "Feel KOBE（神戸公式観光サイト）, 官方觀光網站照片, https://www.feel-kobe.jp/column/winter-sport/"}, {"file": "sights-img/rokkosnow/06.jpg", "caption": "雪場裡的雪人造型裝置（雪季）", "credit": "Feel KOBE（神戸 cility/f01/"}, {"file": "sights-img/maiko/08.jpg", "caption": "通往展望區的圓筒形迴廊", "credit": "兵庫県立舞子公園, 官網照片, https://hyogo-maikopark.jp/facility/f01/"}], "book": false, "tel": "078-785-5090", "tags": [], "ota": [{"site": "Klook", "label": "姬路城＋明石海峽大橋步行團（含舞子海上步道）", "url": "https://www.klook.com/zh-TW/activity/146917-world-heritage-himeji-castle-akashi-kaikyo-bridge-walking-tour/"}, {"site": "KKday", "label": "橋の科学館（明石海峽大橋旁）門票", "url": "https://www.kkday.com/zh-tw/product/171007"}]}, {"id": "ojizoo", "name": "神戶市立王子動物園（おうじどうぶつえん）", "group": "osaka", "sub": true, "areaLabel": "神戶・王子公園", "intro": "神戶市區的老字號動物園，就在阪急王子公園站旁，大人入園 600 円、國中以下免費，是很划算的親子景點。園內有亞洲象、長頸鹿、河馬、無尾熊、企鵝和紅鶴等上百種動物，坡道平緩、動線不長，推嬰兒車、陪長輩慢慢走 2–3 小時剛好；園內還有小型遊樂園和可以接觸小動物的廣場。冬天動物比較有精神，晴天的上午最適合；注意大貓熊「旦旦」已於 2024 年過世，現在看不到大貓熊。", "highlights": ["亞洲象、長頸鹿、河馬、無尾熊、紅鶴等人氣動物，距離近、好拍照", "「動物ふれあい広場」可以近距離接觸小動物（開放時段、內容以官網為準）", "園內小型遊樂園（另收費），適合幼兒", "國家重要文化財「旧ハンター住宅」就在園內，可順便參觀外觀"], "hours": "11–2 月 9:00–16:30（最後入園 16:00）；每週三休園（遇國定假日開園）、12/29–1/1 休", "fee": "大人（高中以上）600 円、國中以下免費（神戶市民 65 歲以上等有減免，要出示證件）；遊樂園設施另收費", "season": "", "tickets": [], "tips": ["2027/2/2–2/6 期間：2/3（三）休園，2/2、2/4、2/5、2/6 開園 9:00–16:30（官網 2026/11 因系統維護暫停，出發前再確認）。", "從西九條住處：JR 環狀線到大阪，步行到阪急大阪梅田站，搭阪急神戸線（特急到岡本轉普通）到王子公園，約 50 分、510 円；西出口步行約 3 分。", "大貓熊已不在（2024 年過世）；網路上舊文章和部分訂票網站還寫有大貓熊，不要被誤導。", "園內有餐廳和販賣部，也可以帶便當在廣場吃；冬天戶外冷，帶保暖衣物。", "可以和神戶 átoa、神戶港、北野異人館排同一天（阪急王子公園 → 神戸三宮 1 站）。"], "trip": [{"label": "從大阪（梅田・阪急神戸線）", "total_min": 38, "total_price": "約 330 円"}, {"label": "從京都（JR 新快速＋普通）", "total_min": 62, "total_price": "約 1,110 円"}], "access": "", "addr": "神戶市立王子動物園", "official": "https://www.kobe-ojizoo.jp/", "images": [{"file": "sights-img/ojizoo/01.jpg", "caption": "在雪堆上打滾的北極熊（2016 年 1 月攝；現在展示的動物以官網為準）", "credit": "pelican, CC BY-SA 2.0, https://commons.wikimedia.org/wiki/File:Oji_zoo,_Kobe,_Japan_(28569916253).jpg"}, {"file": "sights-img/ojizoo/02.jpg", "caption": "無尾熊（1 月攝）", "credit": "pelican, CC BY-SA 2.0, https://commons.wikimedia.org/wiki/File:Oji_zoo,_Kobe,_Japan_(24219840155).jpg"}, {"file": "sights-img/ojizoo/03.jpg", "caption": "小貓熊（1 月攝）", "credit": "pelican, CC BY-SA 2.0, https://commons.wikimedia.org/wiki/File:Oji_zoo,_Kobe,_Japan_(27898569075).jpg"}, {"file": "sights-img/ojizoo/04.jpg", "caption": "小爪水獺（1 月攝）", "credit": "pelican, CC BY-SA 2.0, https://commons.wikimedia.org/wiki/File:Oji_zoo,_Kobe,_Japan_(23645213103).jpg"}, {"file": "sights-img/ojizoo/05.jpg", "caption": "草原犬鼠（1 月攝）", "credit": "pelican, CC BY-SA 2.0, https://commons.wikimedia.org/wiki/File:Oji_zoo,_Kobe,_Japan_(23592998473).jpg"}, {"file": "sights-img/ojizoo/06.jpg", "caption": "棕尾虹雉（1 月攝）", "credit": "pelican, CC BY-SA 2.0, https://commons.wikimedia.org/wiki/File:Kobe_Oji_zoo_-_Lophophorus_impejanus_(32096839405).jpg"}], "book": false, "tel": "078-861-5624", "tags": ["winter"], "ota": []}, {"id": "ogimachi", "name": "白川鄉合掌村（白川郷・荻町合掌造り集落）", "group": "kyoto", "sub": true, "areaLabel": "岐阜・白川鄉", "intro": "岐阜縣深山裡的世界遺產村落，荻町保存了 100 多棟屋頂又陡又厚的茅草「合掌造」民家，至今還有人居住。這裡是日本有名的豪雪地帶，1 月底到 2 月初通常積雪 1 公尺以上，整座村子像童話裡的雪景明信片。冬天限定的「白川鄉點燈」2027 年辦 4 次，其中 1/31（日）剛好在這次行程期間，但採完全預約制、名額很快賣完。從京都、大阪自己搭車單程約 3 個半到 4 個半小時（經金澤轉巴士），長輩小孩建議參加 Klook／KKday 的團，或排在金澤住一晚。", "highlights": ["荻町城跡展望台：從高處俯瞰整座雪中合掌村，是最經典的照片角度（村內有接駁巴士上去）", "和田家：村內最大的合掌造民家，國家重要文化財，可以進屋看二、三樓的養蠶空間", "冬季點燈：2027 年 1/11、1/17、1/24、1/31（皆為假日），完全預約制，要參加有附入場券的巴士團或預約路線巴士", "明善寺鐘樓門、出會橋（であい橋）吊橋與庄川雪景，村內慢慢走約 2–3 小時"], "hours": "村落自由參觀（請在白天參觀，民宅是私人住家）；和田家約 9:00–17:00（不定休，待確認）；點燈日（2027/1/31 等）白天觀光有入場限制，觀光巴士 14:00 後不能進停車場，點燈時段約 17:30–19:30（依往年，待官網公布）", "fee": "村落免費；和田家 大人約 400 円、小孩約 200 円（待確認）；展望台接駁巴士 單程約 200 円（待確認）；點燈需購買附入場券的巴士團或路線巴士預約", "season": "", "tickets": [], "tips": ["也可以參加 Klook／KKday 從大阪／京都出發的行程（見下方來源）：Klook 有「白川鄉＋金澤一日遊」，可加購大阪或京都來回新幹線，在金澤和團會合，下午逛兼六園、東茶屋街；KKday、Klook 也有大阪出發的兩日遊巴士團（含白川鄉、高山、飛驒之里點燈，住一晚溫泉旅館）。", "2027 年白川鄉點燈：1/11、1/17、1/24、1/31（日），官方公告為完全預約制、沒有入場券不能進村；1/31 剛好在住京都的期間，想看要盡早買有附入場券的團（官網 2026/11 已公告注意事項）。點燈當天白天觀光也有限制，觀光巴士 14:00 以後不能進場、16:00 前要離開。", "自己去：從伏見稻荷住處先到京都站（JR 稻荷 → 京都 5 分），搭特急サンダーバード到敦賀轉北陸新幹線到金澤（約 1 小時 55 分），再搭北鐵／濃飛的白川鄉巴士（金澤站西口，約 1 小時 25 分、2,800 円，要事先預約）。單程合計約 3.5–4 小時，從大阪出發約 4.5 小時，當天來回非常趕，建議在金澤住一晚。", "村內步道是壓實的雪和冰，很滑：全員穿防水防滑的靴子（可以加裝簡易冰爪），長輩帶登山杖；手套、毛帽、暖暖包要帶。嬰兒車在雪地幾乎推不動，小小孩用背帶。", "合掌造是私人住家，不要進入院子或拍門口；村內餐廳不多，假日中午很擠，可以早一點吃或自備點心。"], "trip": [{"label": "從京都（JR 特急＋北陸新幹線＋白川鄉巴士，經金澤）", "total_min": 220, "total_price": "約 10,300 円"}, {"label": "從大阪（JR 特急＋北陸新幹線＋白川鄉巴士，經金澤）", "total_min": 260, "total_price": "約 12,000 円"}], "access": "", "addr": "白川鄉合掌村", "official": "https://shirakawa-go.gr.jp/", "images": [{"file": "sights-img/ogimachi/01.jpg", "caption": "大雪中的荻町合掌村全景（2 月攝）", "credit": "雷太, CC BY 2.0, https://commons.wikimedia.org/wiki/File:Shirakawa_in_winter;_Gifu_Prefecture;_February_2018_(01).jpg"}, {"file": "sights-img/ogimachi/02.jpg", "caption": "被雪覆蓋的合掌造民家（2 月攝）", "credit": "雷太, CC BY 2.0, https://commons.wikimedia.org/wiki/File:Shirakawa_in_winter;_Gifu_Prefecture;_February_2018_(12).jpg"}, {"file": "sights-img/ogimachi/03.jpg", "caption": "積雪的村內小路與合掌屋（2 月攝）", "credit": "雷太, CC BY 2.0, https://commons.wikimedia.org/wiki/File:Shirakawa_in_winter;_Gifu_Prefecture;_February_2018_(02).jpg"}, {"file": "sights-img/ogimachi/04.jpg", "caption": "水田與水渠旁的合掌屋（2 月攝）", "credit": "雷太, CC BY 2.0, https://commons.wikimedia.org/wiki/File:Shirakawa_in_winter;_Gifu_Prefecture;_February_2018_(05).jpg"}, {"file": "sights-img/ogimachi/05.jpg", "caption": "雪中的池塘與合掌屋（2 月攝）", "credit": "雷太, CC BY 2.0, https://commons.wikimedia.org/wiki/File:Shirakawa_in_winter;_Gifu_Prefecture;_February_2018_(13).jpg"}, {"file": "sights-img/ogimachi/06.jpg", "caption": "冬夜裡亮燈的合掌屋（2 月攝）", "credit": "Takashi Hososhima from Tokyo, Japan, CC BY-SA 2.0, https://commons.wikimedia.org/wiki/File:Shirakawago_village_(12705389644).jpg"}, {"file": "sights-img/ogimachi/07.jpg", "caption": "明善寺鐘樓門的雪景（1 月攝）", "credit": "Raita Futo from Tokyo, Japan, CC BY 2.0, https://commons.wikimedia.org/wiki/File:Myozenji_temple_(51814494907).jpg"}, {"file": "sights-img/ogimachi/08.jpg", "caption": "雪中的庄川河谷（2 月攝）", "credit": "雷太, CC BY 2.0, https://commons.wikimedia.org/wiki/File:Shirakawa_in_winter;_Gifu_Prefecture;_February_2018_(16).jpg"}], "book": false, "tel": "05769-6-1013", "tags": ["tour", "winter"], "ota": [{"site": "Klook", "label": "白川鄉＋金澤一日遊（可加購大阪／京都來回新幹線，金澤會合）", "url": "https://www.klook.com/zh-TW/activity/181355-shirakawago-and-kanazawa-day-tour/"}, {"site": "Klook", "label": "大阪出發 飛驒之里點燈＋白川鄉 兩日遊巴士團", "url": "https://www.klook.com/zh-TW/activity/97492-2-day-shirakawa-go-hida-no-sato-gassho-village-hida-takayama-join-bus-tour-osaka/"}, {"site": "KKday", "label": "大阪出發 白川鄉・高山・飛驒之里點燈 兩日遊", "url": "https://www.kkday.com/zh-tw/product/533900"}, {"site": "KKday", "label": "大阪出發 飛驒高山・白川鄉・飛驒之里點燈 兩日遊", "url": "https://www.kkday.com/zh-tw/product/530873"}]}, {"id": "kanazawa", "name": "金澤 兼六園・金澤城・東茶屋街（けんろくえん）", "group": "kyoto", "sub": true, "areaLabel": "石川・金澤", "intro": "北陸第一大城，2024 年北陸新幹線延伸到敦賀後，從京都約 2 小時、大阪約 2 小時 45 分就能到。兼六園是日本三名園之一，冬天松樹上會綁起一條條放射狀的「雪吊」繩，防止積雪壓斷樹枝，下雪時的雪吊、霞池和徽軫燈籠是金澤最有名的冬景。旁邊的金澤城公園免費入園，白色的城牆和城櫓在雪中特別漂亮；東茶屋街保留整排木格子老屋，可以吃金箔霜淇淋。冬天是螃蟹和寒鰤的季節，近江町市場的海鮮丼很受歡迎。", "highlights": ["兼六園：冬天的「雪吊」（每年約 11 月初掛到 3 月中）、徽軫燈籠與霞池，是金澤代表的冬景", "金澤城公園：免費入園，菱櫓、五十間長屋、石川門在雪中很上相", "東茶屋街（ひがし茶屋街）：江戶時代的茶屋老街，金箔霜淇淋、和菓子店", "近江町市場：冬天的香箱蟹、寒鰤、甜蝦海鮮丼（各店營業時間不同）"], "hours": "兼六園 10/16–2 月底 8:00–17:00（最後入園 16:30），全年無休；金澤城公園 冬季約 8:00–17:00 自由入園（菱櫓等館內約 9:00–16:30）；東茶屋街、近江町市場依各店（多數約 9:00–17:00）", "fee": "兼六園 大人（18 歲以上）320 円、6–17 歲 100 円，65 歲以上出示公家證件免費（外國旅客出示護照是否適用待確認）；金澤城公園免費（菱櫓・五十間長屋 大人約 320 円）", "season": "", "tickets": [], "tips": ["也可以參加 Klook／KKday 從大阪／京都出發的行程（見下方來源）：Klook「白川鄉＋金澤一日遊」可加購大阪／京都來回新幹線，在金澤和團會合，含白川鄉、兼六園、東茶屋街；Klook 也有大阪出發的北陸兩日遊（金澤、白川鄉、東尋坊）。", "2027/1/29–2/6 兼六園照常開放（全年無休），雪吊這段期間都還在。北陸冬天常下雪或下雨，帶傘、防水防滑鞋；園內有砂石坡道，桂坂、蓮池門料金所可以借輪椅。", "自己去：從伏見稻荷住處到京都站（JR 稻荷 → 京都 5 分），搭特急サンダーバード到敦賀，同站轉北陸新幹線到金澤，約 1 小時 55 分、約 7,500 円；從大阪站約 2 小時 45 分、約 9,200 円。金澤站東口 6 號乘車處搭北鐵巴士到「兼六園下・金沢城」約 11 分、220 円。", "當天來回很可行：早上 8 點左右從京都出發，10 點到金澤，兼六園＋金澤城約 2 小時、東茶屋街約 1 小時，近江町市場吃午餐。下雪天特急或新幹線偶爾誤點，回程不要排太緊。", "小朋友可以加去金澤 21 世紀美術館（免費區的「游泳池」等作品；週一休館），長輩累了可以在兼六園內的茶屋或時雨亭（9:00–16:30）休息喝抹茶。"], "trip": [{"label": "從京都（JR 特急＋北陸新幹線＋北鐵巴士）", "total_min": 135, "total_price": "約 7,740 円"}, {"label": "從大阪（JR 特急＋北陸新幹線＋北鐵巴士）", "total_min": 175, "total_price": "約 9,430 円"}], "access": "", "addr": "金澤 兼六園・金澤城・東茶屋街", "official": "https://shiro-niwa.pref.ishikawa.lg.jp/kenrokuen-garden/", "images": [{"file": "sights-img/kanazawa/01.jpg", "caption": "雪中的兼六園徽軫燈籠與霞池（12 月攝）", "credit": "tab2_dawa, CC BY 2.0, https://commons.wikimedia.org/wiki/File:Kenroku-en-winter-lantern.jpg"}, {"file": "sights-img/kanazawa/02.jpg", "caption": "兼六園的雪吊與池泉（1 月攝）", "credit": "そらみみ, CC BY-SA 4.0, https://commons.wikimedia.org/wiki/File:Yukitsuri_in_Kenroku_Garden.jpg"}, {"file": "sights-img/kanazawa/03.jpg", "caption": "日本最古老的噴水與雪吊（1 月攝）", "credit": "そらみみ, CC BY-SA 4.0, https://commons.wikimedia.org/wiki/File:Fountain_and_Yukizuri_of_Kenroku_Garden.JPG"}, {"file": "sights-img/kanazawa/04.jpg", "caption": "下雪的金澤城公園（1 月攝）", "credit": "Aspere, CC0, https://commons.wikimedia.org/wiki/File:Kanazawa_Castle_260123_13.jpg"}, {"file": "sights-img/kanazawa/05.jpg", "caption": "積雪的金澤城石垣（1 月攝）", "credit": "Aspere, CC0, https://commons.wikimedia.org/wiki/File:Kanazawa_Castle_260123_03.jpg"}, {"file": "sights-img/kanazawa/06.jpg", "caption": "尾山神社庭園的雪吊（2 月攝）", "credit": "Yusuke.ogawa, CC BY 2.5, https://commons.wikimedia.org/wiki/File:Ishikawa_Kanazawa_Oyama02.jpg"}, {"file": "sights-img/kanazawa/07.jpg", "caption": "兼六園用支柱撐起的老松", "credit": "lumoplank, CC0, https://commons.wikimedia.org/wiki/File:Kenroku-en_-_Kenrokuen645.jpg"}], "book": false, "tel": "076-234-3800", "tags": ["tour", "winter"], "ota": [{"site": "Klook", "label": "白川鄉＋金澤一日遊（大阪／京都出發選項含兼六園、東茶屋街）", "url": "https://www.klook.com/zh-TW/activity/181355-shirakawago-and-kanazawa-day-tour/"}, {"site": "Klook", "label": "大阪出發 北陸兩日遊（金澤・白川鄉・東尋坊）", "url": "https://www.klook.com/zh-TW/activity/150354-hokuriku-essence-2-day-tour-kanazawa-shirakawa-go-tojinbo/"}, {"site": "KKday", "label": "兼六園入園門票（現地使用）", "url": "https://www.kkday.com/zh-tw/product/578624"}]}, {"id": "isejingu", "name": "伊勢神宮（外宮・內宮）・托福橫丁（いせじんぐう・おかげ横丁）", "group": "osaka", "sub": true, "areaLabel": "三重・伊勢", "intro": "日本人一生想去一次的「お伊勢さん」，內宮供奉天照大神，是全日本神社的中心。走過五十鈴川上的宇治橋，沿著鋪滿白碎石、兩旁都是百年杉木的參道走到正宮，非常莊嚴。按傳統先拜伊勢市站旁的外宮，再搭巴士到內宮。內宮門前的「托福橫丁」與「おはらい町」重現江戶到明治時代的街景，可以吃赤福餅、伊勢烏龍麵、松阪牛串燒。從大阪難波搭近鐵特急不必換車約 1 小時 50 分，京都約 2 小時，冬天也很適合當天來回。", "highlights": ["內宮：宇治橋、五十鈴川御手洗場、杉木參道與正宮（正宮前不能拍照）", "外宮：伊勢市站步行約 5 分，傳統上先拜外宮再拜內宮", "托福橫丁・おはらい町：赤福本店、伊勢烏龍麵、松阪牛串、手焼煎餅等老街小吃", "可以加去附近的夫婦岩（二見興玉神社）或鳥羽水族館（另見「鳥羽水族館」）"], "hours": "內宮・外宮 1–4 月 5:00–18:00（10–12 月 5:00–17:00），全年無休；托福橫丁 冬季約 9:30–17:00（依店家）", "fee": "參拜免費；伊勢市站 → 內宮前 三重交通巴士約 470–520 円", "season": "", "tickets": [], "tips": ["也可以參加 Klook／KKday 從大阪／京都出發的一日遊（見下方來源）：大多是早上 7:40–8:00 從梅田或難波上車、傍晚 18:00 左右回大阪，含外宮或內宮、托福橫丁，有的加夫婦岩或三重的大型商場 VISON，約 10–12 小時。", "2027/1/29–2/6 每天都能參拜（1–4 月 5:00–18:00）。2025 年起神宮正在進行「第 63 回式年遷宮」的一連串祭典，期間可能有部分區域管制，出發前看官網最新消息。", "自己去：大阪住處（西九條）搭阪神線到大阪難波約 10 分，轉近鐵特急（往賢島、鳥羽方向）到伊勢市約 1 小時 50 分、約 3,510 円；京都住處先到京都站，近鐵京都站有特急直達伊勢市約 2 小時、約 4,070 円（特急要劃位，假日早上的車容易滿）。伊勢市站前搭三重交通巴士到「內宮前」約 15 分。", "內宮參道是很長的白色碎石路，嬰兒車難推；從宇治橋走到正宮約 10–15 分，正宮前有石階。長輩走累可以在托福橫丁的茶屋坐著吃赤福休息。", "托福橫丁和おはらい町很多店 17:00 前後就關，冬天午後很冷，建議上午拜神宮、中午在橫丁吃飯。"], "trip": [{"label": "從大阪（近鐵特急＋三重交通巴士）", "total_min": 130, "total_price": "約 4,000 円"}, {"label": "從京都（近鐵特急直達＋三重交通巴士）", "total_min": 145, "total_price": "約 4,600 円"}], "access": "", "addr": "伊勢神宮", "official": "https://www.isejingu.or.jp/", "images": [{"file": "sights-img/isejingu/01.jpg", "caption": "雪後的內宮宇治橋（2 月攝）", "credit": "Tawashi2006, CC BY 2.1 jp, https://commons.wikimedia.org/wiki/File:Uji-bashi_05.jpg"}, {"file": "sights-img/isejingu/02.jpg", "caption": "從宇治橋看五十鈴川（2 月攝）", "credit": "Ik T, CC BY 2.0, https://commons.wikimedia.org/wiki/File:Isuzu_River_from_Uji_bridge_-_Feb_10,_2020.jpg"}, {"file": "sights-img/isejingu/03.jpg", "caption": "內宮旁清澈的五十鈴川", "credit": "Zairon, CC BY 4.0, https://commons.wikimedia.org/wiki/File:Ise_Ise-jingu_Isuzugawa_1.jpg"}, {"file": "sights-img/isejingu/04.jpg", "caption":  "境內是平坦的石板路，長輩小孩都好走；可和鷹峯・源光庵（市巴士北1 約 10 分）排成同一天。", "今宮神社的あぶり餅店通常週三休息（遇假日改隔天），要吃先確認。"], "trip": null, "access": "北大路站 ・步行約 15 分", "addr": "京都府京都市北区紫野大徳寺町53", "official": "https://www.rinnou.net/cont_03/07daitoku/", "images": [{"file": "sights-img/daitokuji/01.jpg", "caption": "大德寺境內的朱紅堂宇，地上還有積雪（1 月攝）", "credit": "Hyppolyte de Saint-Rambert, CC BY 4.0, https://commons.wikimedia.org/wiki/File:Daitokuji_(Kita-Ku_Kyoto)_Temple_area_hdsr_S5_01.jpg"}, {"file": "sights-img/daitokuji/03.jpg", "caption": "塔頭土牆與屋頂上的薄雪（1 月攝）", "credit": "Hyppolyte de Saint-Rambert, CC BY 4.0, https://commons.wikimedia.org/wiki/File:Daitokuji_(Kita-Ku_Kyoto)_Temple_area_hdsr_S5_08.jpg"}, {"file": "sights-img/daitokuji/04.jpg", "caption": "雪後的塔頭門前（1 月攝）", "credit": "Hyppolyte de Saint-Rambert, CC BY 4.0, https://commons.wikimedia.org/wiki/File:Daitokuji_area_(Kita-Ku_Kyoto)_winter_hdsr_S5_01.jpg"}, {"file": "sights-img/daitokuji/05.jpg", "caption": "境內的石佛與石燈籠（1 月攝）", "credit": "Hyppolyte de Saint-Rambert, CC BY 4.0, https://commons.wikimedia.org/wiki/File:Daitokuji_area_(Kita-Ku_Kyoto)_winter_hdsr_S5_05.jpg"}, {"file": "sights-img/daitokuji/06.jpg", "caption": "龍源院 雪中的石燈籠與苔庭（1 月攝）", "credit": "Hyppolyte de Saint-Rambert, CC BY 4.0, https://commons.wikimedia.org/wiki/File:Ryōgen-in_Daitokuji_(Kyoto_Kita-Ku)_winter_snow_hdsr_S5_01.jpg"}, {"file": "sights-img/daitokuji/07.jpg", "caption": "龍源院 積雪的庭園步道（1 月攝）", "credit": "Hyppolyte de Saint-Rambert, CC BY 4.0, https://commons.wikimedia.org/wiki/File:Ryōgen-in_Daitokuji_(Kyoto_Kita-Ku)_winter_snow_hdsr_S5_05.jpg"}, {"file": "sights-img/daitokuji/08.jpg", "caption": "龍源院 掛著雪的松枝（1 月攝）", "credit": "Hyppolyte de Saint-Rambert, CC BY 4.0, https://commons.wikimedia.org/wiki/File:Ryōgen-in_Daitokuji_(Kyoto_Kita-Ku)_winter_snow_hdsr_S5_10.jpg"}], "book": false, "tel": "075-491-0019", "tags": ["hidden", "winter"], "ota": []}, {"id": "kyotorailway", "name": "京都鐵道博物館（京都鉄道博物館・きょうとてつどうはくぶつかん）", "group": "kyoto", "sub": false, "areaLabel": "京都站・梅小路", "intro": "JR 西日 ng": false, "note": "現場也能買，官網前売票可以免排隊；另有和京都鐵道博物館等的套票，可在官網「チケット購入」比較。", "tel": "075-354-3130"}], "tips": ["依官網 2026 年度營業日曆，2027/1/25–2/10 每天都是 10:00–18:00，1/29–2/2 照常營業、沒有休館日；入場與年票受理到閉館前 1 小時。", "2026/11/21–2027/3/31 有冬季活動「冬のあったかすいぞくかん」：水母水槽裡的特設沙發座、海狗暖暖觀察區、熱飲和熱紅豆湯（ぜんざい）等期間限定餐點。", "從伏見稻荷住處：JR 稻荷站 → 京都站轉 JR 嵯峨野線到梅小路京都西站，出站步行約 7 分；全程約 25 分、約 180 円。或從京都站中央口沿七條通往西走約 15 分。", "帶小孩、長輩：館內有斜坡和電梯，可以推嬰兒車入館；入口有投幣置物櫃可以寄大件行李。館內有 3 處咖啡廳可以吃輕食（漢堡、肉包等）。", "平日上午常有學校遠足團體，想慢慢看可以下午去；和京都鐵道博物館步行約 5–10 分，兩館可以排同一天。"], "trip": null, "access": "京都站 烏丸線京都站往北出 JR 京都站中央口，沿七條通往西（或轉 JR 嵯峨野線到梅小路京都西站）・步行約 15 分", "addr": "京都市下京区観喜寺町35-1", "official": "https://www.kyoto-aquarium.com/", "images": [{"file": "sights-img/kyotoaquarium/01.jpg", "caption": "梅小路公園裡的京都水族館", "credit": "Kirakirameister, CC BY-SA 3.0, https://commons.wikimedia.org/wiki/File:KYOTO_AQUARIUM.JPG"}, {"file": "sights-img/kyotoaquarium/02.jpg", "caption": "京都的大山椒魚", "credit": "Makarok, CC BY-SA 4.0, https://commons.wikimedia.org/wiki/File:Andrias_japonicus_2.jpg"}, {"file": "sights-img/kyotoaquarium/03.jpg", "caption": "大山椒魚水槽", "credit": "V31S70, CC BY 2.0, https://commons.wikimedia.org/wiki/File:Andrias_japonicus_pair.jpg"}, {"file": "sights-img/kyotoaquarium/04.jpg", "caption": "開普敦企鵝", "credit": "inunami, CC BY 2.0, https://commons.wikimedia.org/wiki/File:Kyoto_20221026121238_(52650318519).jpg"}, {"file": "sights-img/kyotoaquarium/05.jpg", "caption": "海豚劇場的海豚", "credit": "Oilstreet, CC BY 2.5, https://commons.wikimedia.org/wiki/File:KYOTO_AQUARIUM12-r.jpg"}, {"file": "sights-img/kyotoaquarium/06.jpg", "caption": "戶外的海豚劇場", "credit": "Mti, CC BY-SA 3.0, https://commons.wikimedia.org/wiki/File:Kyoto_Aquarium_in_2013-5-2_No,21.JPG"}, {"file": "sights-img/kyotoaquarium/07.jpg", "caption": "探出水面的瓶鼻海豚", "credit": "Strangeeye 294, CC BY 3.0, https://commons.wikimedia.org/wiki/File:Dolphin_(216048995).jpeg"}], "book": false, "tel": "075-354-3130", "tags": ["winter"], "ota": [{"site": "Klook", "label": "京都水族館門票", "url": "https://www.klook.com/zh-TW/activity/15334-aquarium-admission-ticket-kyoto/"}, {"site": "KKday", "label": "京都水族館門票", "url": "https://www.kkday.com/zh-tw/product/149556-kyoto-aquarium-admission-ticket-japan"}, {"site": "KKday", "label": "京都水族館門票＋迷你和傘拼貼工作坊", "url": "https://www.kkday.com/zh-tw/product/183408"}]}, {"id": "kyotozoo", "name": "京都市動物園（きょうとしどうぶつえん）", "group": "kyoto", "sub": false, "areaLabel": "岡崎", "intro": "1903 年開園、日本第二古老的動物園，就在平安神宮旁的岡崎公園裡。2015 年完成全面整修，分成亞洲象的「ゾウの森」、長頸鹿和斑馬的「アフリカの草原」、大猩猩的「ゴリラのおうち」、重現京都山林的「京都の森」，以及室內的熱帶動物館。園區不大，2 小時左右就能逛完，大人 750 円、國中生以下免費，是帶小孩最省錢的行程之一，看完可以走到平安神宮。", "highlights": ["ゾウの森：亞洲象群在大片運動場活動，旁邊有大象造型溜滑梯", "アフリカの草原（長頸鹿、斑馬）、ゴリラのおうち、ネコのこみち（老虎等貓科動物）", "ひかり・みず・みどりの熱帯動物館：室內展館，冬天也暖和", "おとぎの国：可以接觸天竺鼠、兔子、山羊等小動物（時間依現場公告）；京都の森重現京都山裡的動物和林相"], "hours": "12–2 月 9:00–16:30（入園到 16:00）；每週一休園（遇國定假日改隔天平日），年底年初 12/28–1/1 休園", "fee": "大人 750 円、國中生以下免費（京都市民 70 歲以上的免費優惠不適用觀光客）", "season": "", "tickets": [], "tips": ["2027/1/29–2/2 期間：2/1（一）休園；1/29（五）、1/30（六）、1/31（日）、2/2（二）有開。", "從伏見稻荷住處：京阪伏見稻荷站 → 三條站（約 10 分、240 円），步行轉地下鐵東西線三條京阪站 → 蹴上站（2 站），1 號出口沿疏水往北走約 7 分；全程約 25–30 分、約 460 円。", "門票可用信用卡、交通 IC 卡付款；當天門票蓋章後可以再入園。園內有商店和授乳室。", "冬天動物上午比較活躍，戶外區風大要穿暖；遇到寒冷或雨天，部分動物會待在室內展舍。", "附近順遊：平安神宮（步行約 5 分）、南禪寺・水路閣（步行約 10 分），可以排成岡崎半日遊。"], "trip": null, "access": "蹴上站 1號出口・步行約 8 分", "addr": "京都市左京区岡崎法勝寺町", "official": "https://zoo.city.kyoto.lg.jp/zoo/", "images": [{"file": "sights-img/kyotozoo/01.jpg", "caption": "京都市動物園東入口", "credit": "Kamigata0, CC BY-SA 4.0, https://commons.wikimedia.org/wiki/File:Kyoto_City_zoo,_East_Entrace._京都市動物園：東出入口.JPG"}, {"file": "sights-img/kyotozoo/02.jpg", "caption": "ゾウの森的亞洲象", "credit": "笹谷康之, CC BY-SA 4.0, https://commons.wikimedia.org/wiki/File:Zoukyoto.jpg"}, {"file": "sights-img/kyotozoo/03.jpg", "caption": "アフリカの草原的長頸鹿", "credit": "Yanajin33, CC BY-SA 4.0, https://commons.wikimedia.org/wiki/File:京都市動物園_-_キリン1.JPG"}, {"file": "sights-img/kyotozoo/04.jpg", "caption": "走過頭頂空中通道的老虎", "credit": "Nori Norisa from 熊谷市, Japan, CC BY 2.0, https://commons.wikimedia.org/wiki/File:トラが行ったり来たり_(53614290143).jpg"}, {"file": "sights-img/kyotozoo/05.jpg", "caption": "大象造型溜滑梯", "credit": "Yanajin33, CC BY-SA 4.0, https://commons.wikimedia.org/wiki/File:京都市動物園_-_ゾウのすべり台.JPG"}, {"file": "sights-img/kyotozoo/06.jpg", "caption": "重現京都山林的「京都の森」", "credit": "Ele-phunk, CC BY-SA 4.0, https://commons.wikimedia.org/wiki/File:京都市動物園_-_京都の森1.JPG"}, {"file": "sights-img/kyotozoo/07.jpg", "caption": "室內的熱帶動物館", "credit": "Yanajin33, CC BY-SA 4.0, https://commons.wikimedia.org/wiki/File:京都市動物園_-_熱帯動物館.JPG"}], "book": false, "tel": "075-771-0210", "tags": ["winter"], "ota": []}, {"id": "yoshidasetsubun", "name": "吉田神社節分祭（よしだじんじゃ せつぶんさい）", "group": "kyoto", "sub": false, "areaLabel": "吉田・京都大學", "intro": "京都大學東側吉田山上的吉田神社，節分祭從室町時代延續至今，是京都規模最大的節分活動，每年約 50 萬人參拜。祭典在節分前後三天舉行（2027 年節分是 2/3，祭期 2/2–2/4），2/2、2/3 兩天參道和境內擺滿約 800 個攤位。2/2 傍晚的「追儺式（鬼やらい）」重現平安時代宮中的驅鬼儀式：戴著四隻金色眼睛面具的「方相氏」帶著童子，把紅、藍、黃三色鬼趕出神社；2/3 深夜的「火爐祭」則把大家帶來的舊御札放進巨大火爐焚燒。", "highlights": ["追儺式（鬼やらい神事）：2/2 傍晚在本宮前舞殿，方相氏驅趕赤・青・黃鬼，最後由殿上人以桃木弓射葦箭驅邪", "約 800 攤露店：2/2–2/3 從參道一路排到境內，日本祭典小吃一次吃遍", "節分限定：附抽獎券的「厄除け福豆」、只在節分期間授與的梔子色厄除御札", "火爐祭：2/3 深夜，直徑約 4 m 的大火爐焚燒舊御札、御守；大元宮內院節分 3 天特別開放參拜"], "hours": "境內全天可參拜；節分祭 2027/2/2（二）–2/4（四），露店 2/2–2/3", "fee": "免費參觀（福豆、御札等另購）", "season": "", "tickets": [], "tips": ["2027 年日程（神社公告的固定日程：節分前日、當日、後日）：2/2（二）前日祭，傍晚追儺式（往年約 18:00）；2/3（三）當日祭，深夜火爐祭（往年約 23:00）；2/4（四）後日祭；露店 2/2、2/3 兩天。各儀式的確切時間以神社 2027 年公告為準（待確認）。", "我們 2/2 上午離開京都，要看節分祭得另外安排：①2/2 退房後行李先寄放或送到大阪，白天逛露店、傍晚看追儺式，再回大阪西九條（約 1 小時 20 分）；②2/3（三）從大阪當天往返（淀屋橋搭京阪特急直達出町柳約 55 分、約 550 円），白天逛露店。追儺式現場人擠人、前面常看不到，帶小孩長輩要有心理準備。", "人潮非常擁擠，嬰兒車很難推，建議改用背巾；吉田山參道有坡和階梯，長輩避開傍晚尖峰比較輕鬆。節分期間神社臨時停車場不開放，只能搭大眾運輸。", "從伏見稻荷住處：京阪伏見稻荷站搭往出町柳方向到終點出町柳站（約 16 分、300 円），2 號出口沿川端通往南、在東一條往東走，約 20 分；或從京阪出町柳站前搭市巴士 201 號到「京大正門前」（約 4 分），下車走 5 分。", "同時期京都其他節分活動（依往年模式，2027 年時間待確認）：八坂神社 2/2–2/3 下午有舞妓奉納舞蹈和撒豆；住處旁的伏見稻荷大社節分當天（2/3）往年 11:30、13:00 在外拜殿撒豆，城南宮 2/3 上午 9:00 有節分祭；城南宮公告 2027/2/1–2/3 參拜者可免費領福豆，2/1 還住在京都時可以順路去。"], "trip": null, "access": "今出川站 3號出口・步行約 35 分", "addr": "京都市左京区吉田神楽岡町30", 、假日到 14:30）", "おそうじ館：打掃的歷史與道具，拿拖把消滅灰塵和塵蟎的體感小遊戲"], "hours": "10:00–16:00（最後入館 15:30）；週一休館（遇假日改隔天平日休），盂蘭盆節、年底年初休館", "fee": "入館免費；ミスドキッチン 1 組（2 人）2,400 円；甜甜圈球裝飾 1 份 300 円", "season": "", "tickets": [{"item": "ミスドキッチン ドーナツ手づくり体験", "price": "1 組（2 人）2,400 円", "url": "https://www.duskin-museum.jp/misudo_museum/misudo_kitchen/", "need_booking": true, "note": "每天 2 場：10:15–11:45、14:00–15:30；2 人一組報名，一次最多 8 組，超過名額抽選，報名期間見預約頁月曆。小學 1–3 年級要和國中以上的人同組（兩人都要付費）；學齡前不能參加、嬰幼兒不能進廚房。需先註冊會員並登錄信用卡。"}], "tips": ["2027/2/2（二）–2/6（六）每天開館（週一休館不影響）。", "從西九條住處：JR 到大阪站（約 5 分），步行到地下鐵梅田站轉御堂筋線到江坂站（約 9 分），全程約 30 分、約 420 円；江坂站 8 號出口沿內環狀線往豐中方向走約 10 分，高架橋前的側道左轉。", "手作體驗以 2 人一組報名，7 個人要湊成 4 組或有人在外面等；只有體驗者能進廚房。", "館內沒有用餐空間，飲料只能在指定區域喝；有個室型育嬰室。沒有專用停車場。", "江坂在新大阪北邊 2 站，可以和萬博紀念公園・NIFREL 或杯麵博物館排在同一天。"], "trip": null, "access": "江坂站 8號出口・步行約 10 分", "addr": "大阪府吹田市芳野町5-32", "official": "https://www.duskin-museum.jp/", "images": [{"file": "sights-img/misdomuseum/01.jpg", "caption": "2024 年新設的「ドーナツの森」", "credit": "ダスキンミュージアム公式サイト, https://www.duskin-museum.jp/"}, {"file": "sights-img/misdomuseum/02.jpg", "caption": "展示歷代商品的甜甜圈隧道", "credit": "ダスキンミュージアム公式サイト, https://www.duskin-museum.jp/"}, {"file": "sights-img/misdomuseum/03.jpg", "caption": "Mister Donut 歷史展示", "credit": "ダスキンミュージアム公式サイト, https://www.duskin-museum.jp/"}, {"file": "sights-img/misdomuseum/04.jpg", "caption": "甜甜圈主題展示區", "credit": "ダスキンミュージアム公式サイト, https://www.duskin-museum.jp/"}, {"file": "sights-img/misdomuseum/05.jpg", "caption": "Mister Donut 創業者展示角", "credit": "ダスキンミュージアム公式サイト, https://www.duskin-museum.jp/"}, {"file": "sights-img/misdomuseum/06.jpg", "caption": "ミスドキッチン：擀甜甜圈麵團", "credit": "ダスキンミュージアム公式サイト, https://www.duskin-museum.jp/"}, {"file": "sights-img/misdomuseum/07.jpg", "caption": "ミスドキッチン：壓出甜甜圈形狀", "credit": "ダスキンミュージアム公式サイト, https://www.duskin-museum.jp/"}, {"file": "sights-img/misdomuseum/08.jpg", "caption": "甜甜圈球裝飾體驗", "credit": "ダスキンミュージアム公式サイト, https://www.duskin-museum.jp/"}], "book": true, "tel": "06-6821-5000", "tags": ["new", "winter"], "ota": []}, {"id": "drumtaokyoto", "name": "DRUM TAO 京都和太鼓劇場（DRUM TAO THEATER KYOTO）", "group": "kyoto", "sub": false, "areaLabel": "京都站・東寺", "intro": "2026 年 4 月 9 日開幕，位在京都站八条口旁京都 Avanti 大樓 9 樓，是世界巡演的和太鼓表演團體 DRUM TAO 的常設劇場。每天晚上演出 2 場，內容完全不同、各約 40–50 分鐘：19:00 第一部「響 HIBIKI」是像祭典一樣熱鬧的觀眾參與型演出，還有觀眾上台體驗打太鼓的橋段，最適合全家；21:00 第二部「夢 YUME」結合影像、燈光和抒情曲目，氣氛夢幻、偏大人。全場對號座、附 1 杯飲料，劇場有酒吧酒廊、屋頂露台和紀念品店。京都晚上能去的室內活動不多，冬天天黑得早，吃完晚餐來看一場剛好。", "highlights": ["19:00「響 HIBIKI」：觀眾一起拍手、上台體驗打太鼓的祭典式演出，最適合帶小孩和長輩", "21:00「夢 YUME」：太鼓 × 和樂器 × 影像光影的夢幻夜場，兩部曲目完全不同", "為這座劇場量身打造的演目，不用懂日文也看得懂", "Premium 席附法被（祭典短外套）與優先入場；劇場有酒吧酒廊、屋頂露台和周邊商店"], "hours": "每天 19:00、21:00 兩場（各約 40–50 分）；休演日以官網售票頁為準", "fee": "全席指定、附 1 杯飲料：標準席 10,000 円、Premium 席 15,000 円（京都市民、府民另有優惠價）", "season": "", "tickets": [{"item": "公演門票（全席指定、附 1 杯飲料）", "price": "標準席 10,000 円／Premium 席 15,000 円", "url": "https://www.s2.e-get.jp/tao-kyoto/pt/?E=en", "need_booking": true, "note": "官網線上售票，也有 Klook／KKday 代售。售票網站註明未滿 6 歲不能入場（請以官網為準）；未滿 20 歲不能點酒。"}], "tips": ["2027/1/29（五）–2/2（二）住京都期間每天晚上都有演出（休演日以售票頁月曆為準）；7 人要坐在一起，建議提早買。", "從伏見稻荷住處：JR 奈良線稻荷站 → 京都站約 5 分、150 円，八条口出來就是京都 Avanti，搭電梯到 9 樓；19:00 場散場後回住處很方便。", "依售票網站資訊，未滿 6 歲（學齡前）不能入場，帶小小孩的家庭請先確認。", "太鼓聲量很大、振動強，對聲音敏感的長輩或小孩可以帶耳塞。", "Avanti 地下有超市和餐廳，演出前可以在京都站一帶先吃晚餐。"], "trip": null, "access": "京都站 八条口（JR京都站南側）・步行約 3 分", "addr": "京都府京都市南区東九条西山王町31 アバンティビル9階", "official": "https://drum-tao-kyoto.com/", "images": [{"file": "sights-img/drumtaokyoto/01.jpg", "caption": "DRUM TAO 京都劇場的和太鼓演出", "credit": "happyell（ハッピーエル）採訪照片, https://happyell.co.jp/drum-tao-kyoto"}, {"file": "sights-img/drumtaokyoto/02.jpg", "caption": "大太鼓齊奏的舞台", "credit": "happyell（ハッピーエル）採訪照片, https://happyell.co.jp/drum-tao-kyoto"}, {"file": "sights-img/drumtaokyoto/03.jpg", "caption": "結合影像與燈光的演出", "credit": "happyell（ハッピーエル）採訪照片, https://happyell.co.jp/drum-tao-kyoto"}, {"file": "sights-img/drumtaokyoto/04.jpg", "caption": "劇場內部與舞台", "credit": "happyell（ハッピーエル）採訪照片, https://happyell.co.jp/drum-tao-kyoto"}, {"file": "sights-img/drumtaokyoto/05.jpg", "caption": "劇場的酒吧酒廊", "credit": "happyell（ハッピーエル）採訪照片, https://happyell.co.jp/drum-tao-kyoto"}, {"file": "sights-img/drumtaokyoto/06.jpg", "caption": "通往劇場的走廊壁畫", "credit": "happyell（ハッピーエル）採訪照片, https://happyell.co.jp/drum-tao-kyoto"}, {"file": "sights-img/drumtaokyoto/07.jpg", "caption": "劇場紀念品店", "credit": "happyell（ハッピーエル）採訪照片, https://happyell.co.jp/drum-tao-kyoto"}, {"file": "sights-img/drumtaokyoto/08.jpg", "caption": "DRUM TAO THEATER KYOTO 標誌", "credit": "DRUM TAO THEATER KYOTO 公式サイト, https://drum-tao-kyoto.com/"}], "book": true, "tel": "", "tags": ["new", "winter"], "ota": [{"site": "Klook", "label": "DRUM TAO THEATER KYOTO 公演門票", "url": "https://www.klook.com/zh-TW/activity/199980-drum-tao-theater-kyoto-admission-ticket/"}, {"site": "Klook", "label": "DRUM TAO 京都 太鼓體驗＋拍照特別套票", "url": "https://www.klook.com/zh-TW/activity/196722-drum-tao-theater-kyoto-special-package-with-drum-experience-photo/"}]}, {"id": "funeshiru", "name": "船舶體驗博物館 ふねしる（商船三井ミュージアム「ふねしる」）", "group": "osaka", "sub": false, "areaLabel": "南港・ATC", "intro": "2025 年 7 月 19 日開幕，日本海運大公司商船三井在大阪南港 ATC（亞太貿易中心）開的體驗型博物館，旁邊就是往九州的渡輪「さんふらわあ」碼頭。一進門是橫寬 30 公尺的大型劇場，播放巨大船隻和港口的影像；最受歡迎的是號稱世界首創、被 310 度 LED 螢幕包圍的正式操船模擬器（1 次 5 分、500 円，同行者可一起上），可以選渡輪或貨櫃船，在晴天或暴風雨的大阪灣當船長。還能畫自己的船、讓它在牆面上游動，體驗輪機員的工作、穿船員制服拍照，認識船和海運怎麼支撐我們的日常生活。館內有咖啡廳和商店，全在室內，冬天也舒服。", "highlights": ["世界首創的 310 度 LED 操船模擬器：選渡輪或貨櫃船，在晴天或暴風雨的大阪灣航行（1 次 5 分、500 円）", "橫寬 30 公尺的「大パノラマシアター」：巨大船隻與港口的影像迎賓", "「船をえがこう！」：自己畫的船會在牆面游動，另付費可印成 T 恤或托特包帶回家", "輪機員工作體驗、龍門起重機模擬器、穿船員制服的拍照亭", "咖啡廳以「漂洋過海運來的食物」為主題（原創咖哩等），另有博物館商店"], "hours": "週日–三 10:00–18:00（最後入館 17:30）、週五・六 10:00–18:30（最後入館 18:00）；每週四休館，年底年初 12/29–1/1 休館", "fee": "平日：高中以上 800 円、小・國中生 400 円；假日：900 円／450 円；學齡前免費（網路預售票便宜約 100 円）；操船模擬器 1 次 500 円", "season": "", "tickets": [{"item": "操船シミュレータ體驗券", "price": "1 次 500 円（約 5 分，同行者可一起）", "url": "https://www.mol.co.jp/museum/guide/", "need_booking": false, "note": "入館後在館內購買；人多時可能要排隊等候。"}], "tips": ["2027/2/2–2/6 期間：2/4（四）休館，其他天都開，週五、六開到 18:30。", "從西九條住處：JR 環狀線到弁天町站轉地下鐵中央線到コスモスクエア站，再轉ニュートラム 1 站到トレードセンター前站，約 25 分、390 円；站內直通 ATC ITM 棟 2 樓。", "當天可以憑「入館紀念券」不限次數再入場；ATC 裡有約 50 家商店和面海的美食街，可以在這裡吃午餐。", "內容最適合小學生到國中生；小小孩可以玩畫船和模擬器（大人陪同），長輩可以看劇場和船模型。"], "trip": null, "access": "トレードセンター前站 ATC ITM棟2階直結・步行約 2 分", "addr": "大阪府大阪市住之江区南港北2-1-10 ATC ITM棟2階", "official": "https://www.mol.co.jp/museum/", "images": [{"file": "sights-img/funeshiru/01.jpg", "caption": "入口的大パノラマシアター與展示區", "credit": "商船三井ミュージアム「ふねしる」公式サイト, https://www.mol.co.jp/museum/"}, {"file": "sights-img/funeshiru/02.jpg", "caption": "310 度 LED 螢幕包圍的操船模擬器", "credit": "商船三井ミュージアム「ふねしる」公式サイト, https://www.mol.co.jp/museum/"}, {"file": "sights-img/funeshiru/03.jpg", "caption": "各種船隻模型展示", "credit": "商船三井ミュージアム「ふねしる」公式サイト, https://www.mol.co.jp/museum/"}, {"file": "sights-img/funeshiru/04.jpg", "caption": "「船をえがこう！」畫好的船會在牆面游動", "credit": "商船三井ミュージアム「ふねしる」公式サイト, https://www.mol.co.jp/museum/"}, {"file": "sights-img/funeshiru/05.jpg", "caption": "船員制服與海運工作介紹", "credit": "商船三井ミュージアム「ふねしる」公式サイト, https://www.mol.co.jp/museum/"}, {"file": "sights-img/funeshiru/06.jpg", "caption": "輪機員工作體驗", "credit": "商船三井ミュージアム「ふねしる」公式サイト, https://www.mol.co.jp/museum/"}, {"file": "sights-img/funeshiru/07.jpg", "caption": "商船三井歷史與世界航線展示", "credit": "商船三井ミュージアム「ふねしる」公式サイト, https://www.mol.co.jp/museum/"}, {"file": "sights-img/funeshiru/08.jpg", "caption": "博物館所在的 ATC（亞太貿易中心）", "credit": "商船三井ミュージアム「ふねしる」公式サイト, https://www.mol.co.jp/museum/"}], "book": false, "tel": "", "tags": ["new", "winter"], "ota": []}, {"id": "kyotobotanical", "name": "京都府立植物園・觀覽溫室（きょうとふりつしょくぶつえん）", "group": "kyoto", "sub": false, "areaLabel": "北山・下鴨", "intro": "1924 年開園、日本最早的公立綜合植物園，佔地約 24 公頃，種了約 12,000 種植物。園內的「觀覽溫室」是日本規模最大級的溫室之一，分成熱帶雨林、蘭花、仙人掌、食蟲植物、熱帶果樹等區，冬天進去也很暖和。1 月底–2 月初戶外有山茶花、蠟梅開花，植物用稻草包起來防寒的「わら囲い」也很有冬天的味道。地下鐵北山站 3 號出口出來就是北山門，溫室就在門附近。", "highlights": ["觀覽溫室：熱帶雨林、蘭花、砂漠サバンナ（仙人掌、多肉）、食蟲植物、熱帶果樹等分區，入園費就包含溫室", "冬季看點：山茶花、蠟梅和早開的梅花（梅林盛開多在 2 月中旬以後），以及用稻草包覆防寒的植物", "大草坪、森林和日本植物區，小朋友可以走走跑跑；國中以下免費入園", "往年 1 月底–2 月有「フラワーデザイン展」「洋ラン展」等展覽（2027 年日程待確認）"], "hours": "9:00–17:00（最後入園 16:00）；觀覽溫室 10:00–16:00（最後入室 15:30）；只有年底年初 12/28–1/4 休園，其餘每天開", "fee": "大人 500 円、高中生 250 円、65 歲以上 250 円（要出示年齡證明）；國中以下免費；溫室不另收費；可刷信用卡", "season": "", "tickets": [], "tips": ["2027/1/29（五）–2/2（二）每天都有開。溫室 10:00 才開門，早到可以先逛戶外，溫室 15:30 停止入室。", "從伏見稻荷住處：JR 奈良線稻荷站 → 京都站（2 站），轉地下鐵烏丸線（往國際會館）到北山站（8 站），3 號出口直通植物園北山門；全程約 30 分、約 440 円。", "65 歲以上半價 250 円，要帶護照等能證明年齡的文件；國中以下免費。", "園區很大，長輩可以只逛北山門附近的溫室和周邊，不必走到南邊正門；園內不能帶酒、球類等運動用具和寵物，落葉、果實也不能帶走。", "戶外冬天風大、樹下陰冷，溫室裡又溫暖潮濕，穿可以穿脫的外套最方便。北山通一帶有不少咖啡店和餐廳，可以順便吃午餐。"], "trip": null, "access": "北山站 3號出口・步行約 1 分", "addr": "京都府立植物園・觀覽溫室（きょうとふりつしょくぶつえん）", "official": "https://www.kyotobotanicalgardens.jp/", "images": [{"file": "sights-img/kyotobotanical/01.jpg", "caption": "觀覽溫室外觀", "credit": "Daderot, CC BY-SA 3.0, https://commons.wikimedia.org/wiki/File:Kyoto_Botanical_Garden_-_conservatory.JPG"}, {"file": "sights-img/kyotobotanical/02.jpg", "caption": "池畔的觀覽溫室（12 月攝）", "credit": "PlusMinus, CC BY-SA 3.0, https://commons.wikimedia.org/wiki/File:KyotoBotanicalGarden.jpg"}, {"file": "sights-img/kyotobotanical/03.jpg", "caption": "溫室內的熱帶植物步道", "credit": "Daderot, CC BY-SA 3.0, https://commons.wikimedia.org/wiki/File:Kyoto_Botanical_Garden_-_inside_conservatory.JPG"}, {"file": "sights-img/kyotobotanical/04.jpg", "caption": "溫室「砂漠サバンナ室」的仙人掌", "credit": "MokyJi, CC0, https://commons.wikimedia.org/wiki/File:砂漠サバンナ室_サボテン.jpg"}, {"file": "sights-img/kyotobotanical/05.jpg", "caption": "冬天用稻草包覆防寒的植物（1 月攝）", "credit": "Hyppolyte de Saint-Rambert, CC BY 4.0, https://commons.wikimedia.org/wiki/File:Kyoto_Botanical_Garden_jardin_Hdsr_S5_19.jpg"}, {"file": "sights-img/kyotobotanical/06.jpg", "caption": "冬天的園內主步道（1 月攝）", "credit": "Hyppolyte de Saint-Rambert, CC BY 4.0, https://commons.wikimedia.org/wiki/File:Kyoto_Botanical_Garden_jardin_Hdsr_S5_09.jpg"}, {"file": "sights-img/kyotobotanical/07.jpg", "caption": "1 月下旬開花的山茶花", "credit": "Hyppolyte de Saint-Rambert, CC BY 4.0, https://commons.wikimedia.org/wiki/File:Kyoto_Botanical_Garden_jardin_Hdsr_S5_13.jpg"}, {"file": "sights-img/kyotobotanical/08.jpg", "caption": "2 月開花的木瓜海棠（ボケ）", "credit": "Hyppolyte de Saint-Rambert, CC BY-SA 4.0, https://commons.wikimedia.org/wiki/File:Kyoto_Botanical_Garden_Hdsr_IMG_8253.jpg"}], "book": false, "tel": "075-701-0141", "tags": ["winter"], "ota": []}, {"id": "kyotogosho", "name": "京都御所（きょうとごしょ）", "group": "kyoto", "sub": false, "areaLabel": "京都御苑", "intro": "從 14 世紀到 1869 年遷都東京為止，歷代天皇居住和舉行儀式的皇宮，現在的建築是 1855 年照平安時代樣式重建的。宮內廳 2016 年起全年開放，不用預約、免費參觀，從西側的清所門進去，沿參觀路線看紫宸殿、清涼殿、小御所和御池庭，約 1 小時。外圍的京都御苑是一大片公園，冬天遊客比春秋少，可以慢慢逛。", "highlights": ["紫宸殿：舉行即位禮等重要儀式的正殿，前庭鋪白砂，兩側是「左近之櫻、右近之橘」", "清涼殿：天皇日常起居的御殿，可以看到「昼御座」和御帳台", "御池庭、御內庭：池泉迴遊式庭園，有拱形的欅橋", "免費職員導覽：日語 9:30、10:30、13:30、14:30；英語、中文各 10:00、14:00（約 50 分）；另有免費語音導覽 App（含中文）"], "hours": "免費、不用預約；10–2 月約 9:00–16:00（最後入場約 15:20，待確認）；每週一休（遇假日改隔天），年底年初 12/28–1/4 休，另有因行事臨時停止參觀的日子", "fee": "免費", "season": "", "tickets": [], "tips": ["2027/1/29（五）–2/2（二）：2/1（一）休止；其他天原則上開放，但宮內廳會因行事臨時停止參觀，出發前看官網「參觀カレンダー」。冬季開放時間依旅遊網站資料，以官網為準（待確認）。", "從伏見稻荷住處：JR 稻荷站 → 京都站，轉地下鐵烏丸線（往國際會館）到今出川站，約 25 分、約 410 円；3 號出口沿烏丸通往南走到乾御門約 5 分，再往南走到參觀入口清所門，合計約 10 分。", "只能從西側的清所門進場，入場時檢查隨身行李；行李箱等大型行李、寵物不能帶進去，參觀路線上不能吃東西。", "場內幾乎都是碎石路，推嬰兒車、輪椅會比較吃力；可以向職員借輪椅。參觀路線約 1 小時，冬天碎石廣場沒有遮蔽、風很冷，要穿暖。", "京都御苑內有中立売休憩所（有餐廳、廁所）可以休息；從今出川站搭地鐵 2 站就是京都國際漫畫博物館（烏丸御池），可以排在同一天。"], "trip": null, "access": "今出川站 3號出口・步行約 10 分", "addr": "京都御所（きょうとごしょ）", "official": "https://kyoto-gosho.kunaicho.go.jp/", "images": [{"file": "sights-img/kyotogosho/01.jpg", "caption": "紫宸殿", "credit": "Saigen Jiro, CC0, https://commons.wikimedia.org/wiki/File:Kyoto-gosho_Shishinden_zenkei-2.JPG"}, {"file": "sights-img/kyotogosho/02.jpg", "caption": "建禮門", "credit": "Saigen Jiro, CC0, https://commons.wikimedia.org/wiki/File:Kyoto-gosho_Kenreimon_(closed).JPG"}, {"file": "sights-img/kyotogosho/03.jpg", "caption": "從承明門望向紫宸殿", "credit": "Sailko, CC BY 3.0, https://commons.wikimedia.org/wiki/File:Kyoto,_palazzo_imperiale,_padiglione_shishinden,_01.jpg"}, {"file": "sights-img/kyotogosho/04.jpg", "caption": "紫宸殿南庭與月華門", "credit": "Zairon, CC BY-SA 4.0, https://commons.wikimedia.org/wiki/File:Kyoto_Kaiserpalast_Gekkamon-Tor_&_Halle_für_Staatszeremonien.jpg"}, {"file": "sights-img/kyotogosho/05.jpg", "caption": "清涼殿", "credit": "Saigen Jiro, CC0, https://commons.wikimedia.org/wiki/File:Kyoto-gosho_Seiryoden_zenkei.jpg"}, {"file": "sights-img/kyotogosho/06.jpg", "caption": "清涼殿的「昼御座」與御帳台", "credit": "Saigen Jiro, CC0, https://commons.wikimedia.org/wiki/File:Kyoto-gosho_Seiryoden_Hirunoomashi_&_Michodai.JPG"}, {"file": "sights-img/kyotogosho/07.jpg", "caption": "御池庭", "credit": "Zairon, CC BY-SA 4.0, https://commons.wikimedia.org/wiki/File:Kyoto_Kaiserpalast_Oikeniwa-Garten_3.jpg"}, {"file": "sights-img/kyotogosho/08.jpg", "caption": "御池庭的欅橋", "credit": "Zairon, CC BY-SA 4.0, https://commons.wikimedia.org/wiki/File:Kyoto_Kaiserpalast_Oikeniwa-Garten_Keyakibashi-Brücke_3.jpg"}], "book": false, "tel": "075-211-1215", "tags": ["winter"], "ota": [{"site": "Klook", "label": "京都電動自行車導覽（京都御所、平安神宮等，12 歲以上）", "url": "https://www.klook.com/zh-TW/activity/221335-kyoto-heian-shrine-imperial-palace-e-bike-tour/"}]}, {"id": "sakuyakonohana", "name": "咲くやこの花館（さくやこのはなかん）・鶴見綠地大溫室", "group": "osaka", "sub": false, "areaLabel": "鶴見綠地", "intro": "1990 年「國際花與綠博覽會」時蓋的大型溫室植物館，是日本規模最大級的溫室，熱帶雨林、熱帶花木、乾燥地和高山植物各有展示室，約有 5,500 種植物。高山植物室全年保持低溫，喜馬拉雅藍罌粟等高山花卉在冬天也有展出。整館都在室內，寒流、下雨都不受影響，外面就是花博紀念公園鶴見綠地。", "highlights": ["熱帶雨林植物室：高大的椰子、榕樹和蕨類，抬頭就是玻璃屋頂", "熱帶花木室：扶桑花、九重葛、蘭花等熱帶花卉，冬天也開得很熱鬧", "乾燥地植物室：各式仙人掌和多肉植物", "高山植物室：冷藏展示的喜馬拉雅藍罌粟等高山植物（開花狀況依當天而定）"], "hours": "10:00–17:00（最後入館 16:30）；每週一休館（遇假日改隔天平日），年底年初 12/28–1/4 休", "fee": "大人（高中以上）500 円；國中以下免費（要帶年齡證明）；65 歲以上免費只限大阪市民，遊客照付；只收現金和 PayPay", "season": "", "tickets": [], "tips": ["2027/2/2（二）–2/6（六）都有開；2/1（一）是休館日。", "從西九條住處：JR 大阪環狀線（往大阪・京橋方向）到京橋站，轉地下鐵長堀鶴見綠地線（往門真南）到鶴見綠地站，約 36–45 分、約 440 円；1 號出口出站穿過公園走約 10 分。", "入館費只能付現金或 PayPay，不能刷信用卡；65 歲以上免費只適用大阪市民，家中長輩要付 500 円。", "溫室裡溫度高、濕度大，冬天進館後外套可以脫下拿著；看完整館約 1–1.5 小時。", "鶴見綠地公園很大、冬天花比較少，以溫室為主；從車站到館的 ukan/05.jpg", "caption": "掛著竹簾的町家", "credit": "Hyppolyte de Saint-Rambert, CC BY 4.0, https://commons.wikimedia.org/wiki/File:Museum_of_Housing_and_Living_(Osaka_Kita-ku)_hdsr_S5_18.jpg"}, {"file": "sights-img/konjyakukan/06.jpg", "caption": "町家裡的榻榻米房間", "credit": "Hyppolyte de Saint-Rambert, CC BY 4.0, https://commons.wikimedia.org/wiki/File:Museum_of_Housing_and_Living_(Osaka_Kita-ku)_hdsr_S5_22.jpg"}, {"file": "sights-img/konjyakukan/07.jpg", "caption": "金屏風前的季節擺設", "credit": "Hyppolyte de Saint-Rambert, CC BY 4.0, https://commons.wikimedia.org/wiki/File:Museum_of_Housing_and_Living_(Osaka_Kita-ku)_hdsr_S5_13.jpg"}, {"file": "sights-img/konjyakukan/08.jpg", "caption": "8 樓的天神祭船渡御模型", "credit": "Hyppolyte de Saint-Rambert, CC BY 4.0, https://commons.wikimedia.org/wiki/File:Museum_of_Housing_and_Living_(Osaka_Kita-ku)_hdsr_S5_25.jpg"}], "book": false, "tel": "06-6242-1170", "tags": ["winter"], "ota": []}, {"id": "naturalhistory", "name": "大阪市立自然史博物館（おおさかしりつしぜんしはくぶつかん）", "group": "osaka", "sub": false, "areaLabel": "長居公園", "intro": "長居公園裡的自然史博物館，入口廣場的大屋頂下掛著巨大的鯨魚骨骼，大廳有納瑪象（ナウマンゾウ）和大角鹿的實物大小模型。5 個常設展示室介紹身邊的自然、地球與生命的歷史、生命的進化、自然的恩惠和生物的生活，展示動物、昆蟲、植物等約 1 萬件標本。門票只要 300 円、國中以下免費，同一天還能進隔壁的長居植物園。", "highlights": ["入口廣場的鯨魚骨骼標本，以及大廳的納瑪象、大角鹿模型", "第 2、3 展示室：化石和古生物，從地球誕生講到生命的進化", "第 1、5 展示室：大阪身邊的昆蟲、鳥類、植物和生態立體模型", "門票同日可進長居植物園；免費區「花と緑と自然の情報センター」"], "hours": "11–2 月 9:30–16:30（最後入館 16:00），3–10 月到 17:00；每週一休館（遇假日改隔天平日），年底年初 12/28–1/4 休", "fee": "大人 300 円、高中・大學生 200 円；國中以下免費；65 歲以上免費只限大阪市民；特別展另外收費；大阪周遊パス可免費看常設展", "season": "", "tickets": [], "tips": ["2027/2/2（二）–2/6（六）都有開；2/1（一）休館。特別展的檔期和票價看官網（2027 年 2 月的展覽待確認）。", "從西九條住處：JR 大阪環狀線內回り或大和路快速到天王寺，轉地下鐵御堂筋線（往なかもず）到長居站，約 26–30 分、約 440 円；南剪票口 3 號出口往東穿過長居公園約 800 m（10–15 分）。也可以從 JR 阪和線長居站東口走約 1 km。", "從車站到博物館要在公園裡走 10 分以上，長輩走不動可以搭計程車到博物館門口；長居體育場有大型活動時車站和周邊會很擠。", "冬天 16:00 就停止入館，建議中午前後到；平日上午可能有學校團體參觀。"], "trip": null, "access": "長居站 3號出口・步行約 12 分", "addr": "大阪市立自然史博物館（おおさかしりつしぜんしはくぶつかん）", "official": "https://omnh.jp/", "images": [{"file": "sigh
