const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const telLink = n => n ? `<a class="tel" href="tel:+81${String(n).replace(/[^0-9]/g,'').replace(/^0/,'')}">☎ ${esc(n)}</a>` : '';
const maps = s => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(s.addr || s.name);

function carousel(s){
  if (!s.images.length) return `<div class="car"><div class="noimg">${esc(s.name)}</div></div>`;
  const n = s.images.length;
  return `<div class="car" data-id="${esc(s.id)}" data-i="0" tabindex="0" aria-roledescription="carousel" aria-label="${esc(s.name)} 照片">
    <div class="track">${s.images.map((im,i) => `<figure>${i ? `<img data-src="${esc(im.file)}" alt="${esc(im.caption || s.name)}">` : `<img src="${esc(im.file)}" alt="${esc(im.caption || s.name)}" loading="lazy" decoding="async">`}<figcaption class="cap">${esc(im.caption||'')}<small>${esc(im.credit||'')}</small></figcaption></figure>`).join('')}</div>
    ${n>1 ? `<button class="nav p" type="button" data-step="-1" aria-label="上一張">‹</button><button class="nav n" type="button" data-step="1" aria-label="下一張">›</button>
    <span class="count">1 / ${n}</span><div class="dots">${s.images.map((_,i)=>`<button type="button" data-go="${i}" aria-label="第 ${i+1} 張" aria-current="${i===0}"></button>`).join('')}</div>` : ''}
  </div>`;
}
function card(s){
  const tk = (s.tickets||[]).map(x => `<tr><td>${esc(x.item)}${x.need_booking ? ' <span class="tag book">需預約</span>' : ''}${x.tel ? '<br>'+telLink(x.tel) : ''}</td><td class="pr">${esc(x.price||'')}</td><td>${x.url ? `<a href="${esc(x.url)}" target="_blank" rel="noopener">${x.need_booking ? '訂票' : '官網'} ↗</a>` : ''}</td></tr>`).join('');
  const tr = (s.trip||[]).map(f => `<tr><td>${esc(f.label)}</td><td class="pr">約 ${Math.round(f.total_min/60*10)/10} 小時</td><td>${esc(f.total_price||'')}</td></tr>`).join('');
  return `<article class="card" id="${esc(s.id)}">
    ${carousel(s)}
    <div class="body">
      <h4 class="name">${esc(s.name)}</h4>
      <div class="tagline"><span class="tag">${esc(s.areaLabel)}</span>${(s.tags||[]).includes('onsen') ? '<span class="tag">溫泉</span>' : ''}${(s.tags||[]).includes('winter') ? '<span class="tag">❄ 1–2 月推薦</span>' : ''}${s.book ? '<span class="tag book">有項目需先預約</span>' : ''}${(s.tags||[]).includes('new') ? '<span class="tag">🆕 新開幕</span>' : ''}${(s.tags||[]).includes('hidden') ? '<span class="tag">冷門秘境</span>' : ''}${(s.tags||[]).includes('tour') ? '<span class="tag">🚌 一日遊團</span>' : ''}${(s.ota||[]).length ? `<span class="tag ota">${[...new Set(s.ota.map(o=>o.site))].join('／')} 有售</span>` : ''}</div>
      ${s.intro ? `<p class="intro">${esc(s.intro)}</p>` : ''}
      ${(s.highlights||[]).length ? `<ul class="hl">${s.highlights.map(h=>`<li>${esc(h)}</li>`).join('')}</ul>` : ''}
      <dl>${s.hours ? `<dt>時間</dt><dd>${esc(s.hours)}</dd>` : ''}${s.fee ? `<dt>門票</dt><dd>${esc(s.fee)}</dd>` : ''}${s.season ? `<dt>10–11月</dt><dd>${esc(s.season)}</dd>` : ''}
        ${s.tel ? `<dt>電話</dt><dd>${telLink(s.tel)}</dd>` : ''}
        <dt>交通</dt><dd>${s.trip ? esc(s.trip[0].label) : esc(s.access)}</dd></dl>
      ${tr ? `<details><summary>交通方式比較</summary><div class="tkwrap"><table class="tk"><thead><tr><th>方式</th><th>單程</th><th>車資</th></tr></thead><tbody>${tr}</tbody></table></div></details>` : ''}
      ${tk ? `<details><summary>票價與訂票</summary><div class="tkwrap"><table class="tk"><thead><tr><th>票券</th><th>票價</th><th></th></tr></thead><tbody>${tk}</tbody></table></div></details>` : ''}
      ${(s.tips||[]).length ? `<details><summary>小提醒</summary><ul class="hl">${s.tips.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></details>` : ''}
      ${(s.ota||[]).length ? `<p class="src"><b>來源</b>${s.ota.map(o => `<a href="${esc(o.url)}" target="_blank" rel="noopener"><span class="site">${esc(o.site)}</span>${esc(o.label)} ↗</a>`).join('')}</p>` : ''}
      <div class="links">${s.areaLabel==='我的住宿' ? '' : `<a class="go" href="route.html#${esc(s.id)}">地鐵怎麼去</a>`}<a href="${maps(s)}" target="_blank" rel="noopener">Google 地圖</a>${s.official ? `<a href="${esc(s.official)}" target="_blank" rel="noopener">官網</a>` : ''}<button type="button" class="share" data-share="${esc(s.id)}" aria-label="分享「${esc(s.name)}」">分享</button></div>
    </div></article>`;
}
function pool(){ const q = st.q.trim().toLowerCase(); return S.filter(s => (st.g==='all' || (st.g==='sub' ? s.sub : st.g==='ota' ? (s.ota||[]).length>0 : st.g==='new' ? (s.tags||[]).includes('new') : st.g==='hidden' ? (s.tags||[]).includes('hidden') : st.g==='tour' ? (s.tags||[]).includes('tour') : st.g==='onsen' ? (s.tags||[]).includes('onsen') : st.g==='winter' ? (s.tags||[]).includes('winter') : s.group===st.g)) && (!q || ((t, q) => window.JDS ? JDS.has(q, t) : t.toLowerCase().includes(q))([s.name,s.id,s.intro,s.areaLabel,(s.highlights||[]).join(' '),(s.ota||[]).map(o=>o.site+' '+o.label).join(' ')].join(' '), q))); }
function render(){
  if (SOLO){ renderList(); return; }
  const all = S.filter(s => !st.q || true);
  $('#frow').innerHTML = `<button type="button" class="chip" data-g="all" aria-pressed="${st.g==='all'}">全部<span class="n">${S.length}</span></button>` +
    GROUPS.map(([k,l]) => `<button type="button" class="chip" data-g="${k}" aria-pressed="${st.g===k}">${l}<span class="n">${S.filter(s=>s.group===k).length}</span></button>`).join('') +
    `<button type="button" class="chip" data-g="winter" aria-pressed="${st.g==='winter'}">❄ 1–2 月推薦<span class="n">${S.filter(s=>(s.tags||[]).includes('winter')).length}</span></button>` +
    `<button type="button" class="chip" data-g="sub" aria-pressed="${st.g==='sub'}">近郊<span class="n">${S.filter(s=>s.sub).length}</span></button>` +
    `<button type="button" class="chip" data-g="onsen" aria-pressed="${st.g==='onsen'}">溫泉<span class="n">${S.filter(s=>(s.tags||[]).includes('onsen')).length}</span></button>` +
    [['new','🆕 新開幕'],['hidden','冷門秘境'],['tour','🚌 一日遊團']].filter(([k]) => S.some(s=>(s.tags||[]).includes(k))).map(([k,l]) => `<button type="button" class="chip" data-g="${k}" aria-pressed="${st.g===k}">${l}<span class="n">${S.filter(s=>(s.tags||[]).includes(k)).length}</span></button>`).join('') +
    (S.some(s=>(s.ota||[]).length) ? `<button type="button" class="chip" data-g="ota" aria-pressed="${st.g==='ota'}">Klook／KKday 有售<span class="n">${S.filter(s=>(s.ota||[]).length).length}</span></button>` : '') +
    `<input class="search" id="q" type="search" placeholder="搜尋景點（可打同音字、注音、拼音）" aria-label="搜尋景點" value="${esc(st.q)}">`;
  $('#q').addEventListener('input', e => { st.q = e.target.value; renderList(); });
  renderList();
}
const AREAMAPS = {"osaka": {"file": "sights-img/maps/osaka_areas.jpg", "title": "大阪經典區域 6 選", "caption": "梅田・大阪站／心齋橋・道頓堀・堀江／大阪城・中之島／難波・日本橋／天王寺・阿倍野・新世界／灣區 USJ・海遊館・天保山。點圖可放大", "credit": "LETSGO JP"}};
function renderList(){
  if (SOLO){ $('#list').innerHTML = `<div class="solo">${S.map(card).join('')}</div>`; observe(); return; }
  const L = pool();
  if (!L.length){ $('#list').innerHTML = '<p class="empty">沒有符合的景點。</p>'; return; }
  $('#list').innerHTML = GROUPS.filter(([k]) => L.some(s=>s.group===k)).map(([k,l]) => {
    const G = L.filter(s=>s.group===k);
    const part = (arr, title) => { if (!arr.length) return ''; const areas = [...new Set(arr.map(s=>s.areaLabel))];
      return `<div class="part"><h3 class="parth">${title}<span>${arr.length}</span></h3>${areas.map(a => `<div class="area"><h3>${esc(a)}</h3><div class="grid">${arr.filter(s=>s.areaLabel===a).map(card).join('')}</div></div>`).join('')}</div>`; };
    const M = AREAMAPS[k]; const mp = (M && !st.q.trim()) ? `<figure class="amap"><a href="${esc(M.file)}" target="_blank" rel="noopener"><img src="${esc(M.file)}" alt="${esc(M.title)}" loading="lazy"></a><figcaption><b>${esc(M.title)}</b>・${esc(M.caption)}<br>來源：${esc(M.credit)}</figcaption></figure>` : '';
    return `<section class="group"><h2>${l}<small>${G.length} 個景點</small></h2>${mp}${part(G.filter(s=>!s.sub), l+'市區')}${part(G.filter(s=>s.sub), l+'近郊')}</section>`;
  }).join('');
  observe();
  try { localStorage.setItem('sights-f', JSON.stringify({g:st.g})); } catch(e) {}
}
/* ---------- 輪播 ---------- */
function go(car, i){
  const n = car.querySelectorAll('.track figure').length; if (n < 2) return;
  i = (i + n) % n; car.dataset.i = i;
  const figs = car.querySelectorAll('.track img');
  [i, (i+1)%n].forEach(j => { const im = figs[j]; if (im && im.dataset.src){ im.src = im.dataset.src; im.removeAttribute('data-src'); } });
  car.querySelector('.track').style.transform = `translateX(-${i*100}%)`;
  car.querySelector('.count').textContent = `${i+1} / ${n}`;
  car.querySelectorAll('.dots button').forEach((b,j) => b.setAttribute('aria-current', j===i));
}
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const visible = new Set();
let io = null;
function observe(){
  visible.clear(); if (io) io.disconnect();
  if (!('IntersectionObserver' in window)) return;
  io = new IntersectionObserver(es => es.forEach(e => e.isIntersecting ? visible.add(e.target) : visible.delete(e.target)), {threshold:.5});
  document.querySelectorAll('.car[data-id]').forEach(c => io.observe(c));
}
if (!reduce) setInterval(() => { for (const c of visible) if (!c.matches(':hover') && !c.contains(document.activeElement) && !c.dataset.hold) go(c, +c.dataset.i + 1); }, 4500);
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.g){ st.g = b.dataset.g; render(); return; }
  const car = b.closest('.car'); if (!car) return;
  if (b.dataset.step) go(car, +car.dataset.i + +b.dataset.step);
  else if (b.dataset.go) go(car, +b.dataset.go);
});
document.addEventListener('keydown', e => { const car = e.target.closest?.('.car'); if (!car) return; if (e.key==='ArrowLeft') go(car, +car.dataset.i-1); if (e.key==='ArrowRight') go(car, +car.dataset.i+1); });
let sx = null, scar = null;
document.addEventListener('pointerdown', e => { scar = e.target.closest('.car'); if (scar){ sx = e.clientX; scar.dataset.hold = '1'; } });
document.addEventListener('pointerup', e => { if (scar){ const dx = e.clientX - sx; if (Math.abs(dx) > 40) go(scar, +scar.dataset.i + (dx < 0 ? 1 : -1)); setTimeout(() => { if (scar) delete scar.dataset.hold; scar = null; }, 3000); } });
/* ---------- 分享：每個景點有自己的網頁 s/景點.html ---------- */
const shareUrl = id => new URL('s/' + encodeURIComponent(id) + '.html', document.baseURI).href;
function toast(html){
  let t = $('#toast'); if (!t){ t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; t.setAttribute('role','status'); document.body.appendChild(t); }
  t.innerHTML = html; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 6000);
}
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-share]'); if (!b) return;
  const s = S.find(x => x.id === b.dataset.share); if (!s) return;
  const url = shareUrl(s.id), title = s.name, text = s.name + '｜' + s.areaLabel;
  if (navigator.share){ try { await navigator.share({title, text, url}); return; } catch(err){ if (err && err.name === 'AbortError') return; } }
  try { await navigator.clipboard.writeText(url); toast(`已複製「${esc(s.name)}」的連結，可以直接貼到 LINE`); }
  catch(err){ toast(`長按下面的網址複製：<br><input class="tourl" readonly value="${esc(url)}" onclick="this.select()">`); const i = $('#toast .tourl'); if (i) i.select(); }
});
if (SOLO){
  const s = S[0] || {};
  document.querySelector('.filters')?.remove();
  const h = document.querySelector('.hero');
  if (h) h.innerHTML = `<p class="eyebrow">Sights</p><p class="back"><a href="sights.html#${esc(s.id)}">← 看全部景點</a></p>`;
}
render();
const jump = () => { const h = location.hash.slice(1); const el = h && document.getElementById(h); if (el) el.scrollIntoView({block:'start'}); };
jump(); window.addEventListener('load', jump);

/* ---------- 行程籃（與「行程規劃」頁共用） ---------- */
(function(){
  const KEY = 'jd-basket';
  const get = () => { try { return JSON.parse(localStorage.getItem(KEY)||'[]'); } catch(e) { return []; } };
  const set = v => { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch(e) {} };
  const fab = document.createElement('a'); fab.className = 'basketfab'; fab.href = '#';
  function sync(){
    const b = get();
    fab.innerHTML = `行程籃 <b>${b.length}</b> → 排行程`; fab.hidden = !b.length;
    document.querySelectorAll('[data-plan]').forEach(x => { const on = b.includes(x.dataset.plan); x.setAttribute('aria-pressed', on); x.textContent = on ? '✓ 已加入行程' : '＋行程'; });
  }
  document.addEventListener('click', e => {
    const x = e.target.closest('[data-plan]'); if (!x) return;
    e.preventDefault(); e.stopPropagation();
    const b = get(), id = x.dataset.plan, i = b.indexOf(id);
    if (i >= 0) b.splice(i,1); else b.push(id);
    set(b); sync();
  }, true);
  new MutationObserver(() => { clearTimeout(sync.t); sync.t = setTimeout(sync, 50); }).observe(document.body, {childList:true, subtree:true});
  addEventListener('storage', sync); sync();
})();

</script>
