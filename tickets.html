<script>
const T = [{"id": "contactless", "title": "信用卡感應乘車（タッチ決済）：哪裡能刷、哪裡不能刷", "intro": "卡面有 ))) 波紋標誌的 Visa、Mastercard、JCB、AMEX 等感應式信用卡，或綁在 Apple Pay／Google Pay 裡的卡，可以直接在部分閘門的專用讀卡機感應進出站，不用買票也不用儲值。2026 年 10 月時，大阪的地鐵已經全站可用，但京都市營地鐵和市巴士還不能用。", "steps": [{"text": "找閘門上標有「タッチ決済」或信用卡品牌標誌的讀卡區（和 IC 卡的藍色感應區是不同位置）。", "img": "ticket_img/city_osaka_touch_gate.jpg", "caption": "Osaka Metro 御堂筋線梅田站北改札：閘門入口側的「タッチ決済 Tap to ride」讀卡區（可刷 Visa/Mastercard/JCB/AMEX 等），下方是數位票 QR 碼讀取口。"}, {"text": "進站：把信用卡或手機平放在讀卡區，等燈號由藍轉綠、發出聲音後再通過。", "img": null, "caption": ""}, {"text": "出站：一定要用「同一張卡、同一個裝置」感應（進站刷實體卡、出站刷手機會被擋下）。系統依實際搭乘距離收大人普通票價，通常隔天以後才會出現在帳單上。", "img": null, "caption": ""}, {"text": "查乘車紀錄：到 Q-move 網站（https://www.q-move.info/）免費註冊後，可以查詢乘車明細。", "img": null, "caption": ""}], "passes": [], "images": [{"file": "ticket_img/city_osaka_touch_gate.jpg", "caption": "Osaka Metro 御堂筋線梅田站北改札：閘門入口側的「タッチ決済 Tap to ride」讀卡區（可刷 Visa/Mastercard/JCB/AMEX 等），下方是數位票 QR 碼讀取口。", "credit": "RuinDig/Yuki Uchida, CC BY 4.0, https://commons.wikimedia.org/wiki/File:Osaka---2025-02-15_023.jpg"}], "tips": ["Osaka Metro（地鐵＋新電車 New Tram）：全站可用，品牌包括 Visa、Mastercard、JCB、AMEX、Diners、Discover、銀聯。大阪城市巴士（Osaka City Bus）和 BRT いまざとライナー也從 2025-11-01 起可以刷卡（少數路線除外）。", "京都市營地鐵、京都市巴士：到 2026 年 10 月仍不能刷信用卡（市府計畫 2027 年度導入）。搭近鐵直通京都地鐵時，如果是用信用卡進近鐵站，必須先在竹田站出站結算，否則到地鐵站出不了閘門。", "私鐵：阪急、阪神全站可刷（自動改札機）；近鐵幾乎全站可刷（少數站除外）；南海 105 站中有 97 站可刷（含關西機場、難波）。京阪電車官網沒有信用卡感應乘車服務，請用 IC 卡或 QR 數位票。", "JR 西日本在大阪、京都的一般在來線閘門（查證時）沒有提供信用卡感應乘車，搭 JR 請用 IC 卡或紙票。", "信用卡感應只收大人票價：兒童票、轉乘優惠、一日券優惠都不適用；同一張卡不能多人共用，也不能拿來在精算機補票。", "每次刷卡可能都會被收海外交易手續費（依發卡銀行而定）；短程、多趟的日子，用 IC 卡或一日券可能更划算。"], "sources": ["https://subway.osakametro.co.jp/guide/page/contactless_payment.php", "https://www.kotsu.city.nagoya.jp/rp/ticket/TRP0005579.htm", "https://www.city.kyoto.lg.jp/kotsu/page/0000334479.html", "https://www.kyoto-np.co.jp/articles/-/1718106", "https://www.watch.impress.co.jp/docs/news/1635031.html", "https://hanshin.co.jp/press/docs/20250319-toshikotsu-tattikessaikanryou2.pdf", "https://www.nankai.co.jp/lib/company/news/pdf/251119.pdf", "https://www.keihan.co.jp/traffic/ticket/"]}, {"id": "ic", "title": "IC 卡：ICOCA／Suica／PASMO 與手機錢包", "intro": "日本 10 種主要交通 IC 卡全國互通，在大阪、京都的地鐵、私鐵、公車和超商都能直接感應使用。強烈建議一人一張 IC 卡（實體卡或 iPhone 錢包），省掉每次買票、查運賃表的麻煩。", "steps": [{"text": "實體卡：在 JR 西日本車站（關西機場、新大阪、大阪、京都）有 ICOCA 標誌的售票機或綠色窗口（みどりの窓口）購買，一張 2,000 円（含押金 500 円，可用餘額 1,500 円）。部分機台另有 1,000/3,000/5,000/10,000 円面額；購卡只收現金，不能刷信用卡。", "img": null, "caption": ""}, {"text": "iPhone：打開「錢包」App →「＋」→「交通卡」→ 選 ICOCA、Suica 或 PASMO，用已綁定 Apple Pay 的信用卡儲值即可發卡。在台灣買的 iPhone 8 以後機型也能加入（Apple 只要求 iPhone 8 以後機型＋最新 iOS，不必把地區設成日本）；手機錢包版沒有押金。", "img": null, "caption": ""}, {"text": "Welcome Suica Mobile（JR 東日本官方 App，台灣 App Store 可下載）：免註冊、免押金，僅限 iPhone（iOS 17.2 以上）；有效期 180 天、餘額不能退，適合只想短期使用的人。", "img": null, "caption": ""}, {"text": "進出站：把卡片（或 iPhone 上緣）平放在閘門的藍色 IC 感應區約 1 秒，聽到「嗶」聲、閘門顯示餘額就能通過；出站時一樣感應，系統自動扣款。", "img": "ticket_img/city_ic_card_tap.jpg", "caption": "IC 卡全國互通：Suica 也能在 JR 西日本 ICOCA 區的讀卡機上感應（藍色圓形感應區，上方貼著各種可用 IC 卡的標誌）。"}, {"text": "儲值（チャージ）：在售票機按「チャージ／Charge」→ 把卡插入或放上感應盤 → 選金額（1,000 円為單位）→ 投入現金 → 取回卡片，餘額上限 20,000 円。iPhone 錢包卡可以在錢包 App 裡用信用卡儲值，也可以把手機放上售票機感應盤用現金儲值；7-Eleven、Lawson 等超商收銀台也能用現金儲值。", "img": null, "caption": ""}, {"text": "退卡（回台灣前）：實體 ICOCA 只能在 JR 西日本 ICOCA 區的車站辦理，退款＝餘額 − 手續費 220 円 ＋ 押金 500 円。餘額 220 円以下時只退押金 500 円，所以先在超商把餘額花到接近 0 再退最划算。手機錢包版沒有押金可退。", "img": null, "caption": ""}], "passes": [{"name": "ICOCA（實體卡，JR 西日本）", "price": "2,000 円（含押金 500 円）", "where": "JR 西日本各站有 ICOCA 標誌的售票機、綠色窗口（みどりの窓口）；部分其他公司的車站也有賣", "good_for": "全程主力：關西的地鐵、私鐵、公車、超商都通用；回國前可以退押金", "url": "https://www.jr-odekake.net/icoca/purchase/icoca.html"}, {"name": "Apple 錢包的 ICOCA／Suica／PASMO", "price": "無押金，首次儲值金額自訂", "where": "iPhone「錢包」App 直接發卡（iPhone 8 以後機型、最新 iOS）", "good_for": "不想排隊買卡、想隨時用信用卡儲值的人；一支 iPhone 對應一張卡，同行者要用各自的手機", "url": "https://support.apple.com/108772"}, {"name": "Welcome Suica Mobile", "price": "免費（無押金、無發行費）", "where": "App Store 下載「Welcome Suica Mobile」（台灣區可下載）", "good_for": "短期旅客；注意 180 天到期、餘額不能退，出境前要用完", "url": "https://apps.apple.com/tw/app/id6738336566"}], "images": [{"file": "ticket_img/city_ic_card_tap.jpg", "caption": "IC 卡全國互通：Suica 也能在 JR 西日本 ICOCA 區的讀卡機上感應（藍色圓形感應區，上方貼著各種可用 IC 卡的標誌）。", "credit": "タチヤマカムイ, CC BY-SA 4.0, https://commons.wikimedia.org/wiki/File:Suica_card_tap.jpg"}], "tips": ["Suica、PASMO、ICOCA 等 10 種卡全國互通：在大阪、京都的地鐵和公車都能直接用，不必每到一個城市就換卡。", "實體 Suica／PASMO 曾因晶片短缺暫停販售，2025 年 3 月 1 日已恢復販售無記名卡；不過在關西直接買 ICOCA 最方便。", "Apple 錢包儲值：海外發行的 Mastercard、JCB、AMEX 一般都能用；部分台灣 Visa 卡可能出現「付款未完成」，建議多準備一張卡，或改用車站售票機、超商現金儲值。", "台灣版 Android 手機多半沒有日本的「おサイフケータイ」功能，無法使用 Mobile Suica／ICOCA，請改買實體卡。", "實體卡和 iPhone 不要疊在一起感應；兩張 IC 卡放在同一個票夾也會讀取失敗。", "一般 IC 卡都扣大人票價；同行兒童要在窗口持證件辦理兒童 IC 卡，或購買兒童紙票。"], "sources": ["https://www.jr-odekake.net/icoca/purchase/icoca.html", "https://www.jr-odekake.net/icoca/guide/refund.html", "https://www.jr-odekake.net/icoca/applepay/", "https://support.apple.com/108772", "https://apps.apple.com/tw/app/id6738336566", "https://www.tokyometro.jp/news/2025/219936.html"]}, {"id": "osaka-metro", "title": "大阪地鐵 Osaka Metro：買單程票、補票與一日券", "intro": "Osaka Metro 依距離分 5 區，大人票價 190／240／290／340／390 円（兒童 100～200 円）。有 IC 卡或感應式信用卡就不用買票；要買紙票的話，照下面的步驟、看懂售票機上方的運賃表就行了。", "steps": [{"text": "先看售票機正上方的大型路線圖，也就是運賃表（運賃表／Fare Chart）：找到目的地站名，旁邊的數字就是從本站出發的大人票價（小字通常是兒童票價）。", "img": "ticket_img/city_osaka_fare_chart.jpg", "caption": "Osaka Metro 中百舌鳥站：售票機正上方的大型路線圖就是「運賃表」，每站旁的數字是從本站出發的票價；牆上也貼著 820 円一日券的告示。"}, {"text": "在售票機觸控螢幕上按語言鍵「English」或「中文」（繁體／簡體）切換介面。", "img": "ticket_img/city_osaka_metro_machine.jpg", "caption": "Osaka Metro 江坂站售票機（2020 年拍攝）：螢幕下方有「日本語 / English / 中文 / 한국어」語言鍵。招牌上站名旁的票價是漲價前的舊價，現行票價請看站內的運賃表。"}, {"text": "按「きっぷ／Ticket」，再按和運賃表相同金額的按鈕（例如 240）；多人同行時，先按「大人 2 名」等人數鍵。", "img": null, "caption": ""}, {"text": "投入現金（硬幣或 1,000 円紙鈔；部分機台也收 5,000／10,000 円）。", "img": null, "caption": ""}, {"text": "從下方出口取走車票和找零。把車票插入閘門投票口，從前方取回車票後通過；出站時把車票投入閘門回收。", "img": null, "caption": ""}, {"text": "看不懂票價就先買最便宜的 190 円票。到站後先不要出閘門，找閘門內側的「のりこし精算機（Fare Adjustment）」：投入車票 → 螢幕顯示差額 → 補投現金 → 取出「精算券」，用精算券出站。IC 卡餘額不足時，同一台機器也能儲值。", "img": null, "caption": ""}], "passes": [{"name": "エンジョイエコカード（Osaka Metro＋大阪城市巴士 1 日券，實體卡）", "price": "平日 820 円／週六日及國定假日 620 円（大人）；兒童 310 円", "where": "Osaka Metro 各站售票機、定期券發售處", "good_for": "平日搭 4 次以上（或 3 次較長距離）、週末搭 3 次以上就回本；也可搭大阪城市巴士，還有 20 多處景點折扣。不含夢洲站。", "url": "https://subway.osakametro.co.jp/guide/fare/card_tickets/benri-joshaken.php"}, {"name": "Osaka Metro・大阪城市巴士 1 日乘車券（數位版）", "price": "平日 820 円／週六日及國定假日 620 円（大人）；兒童 310 円", "where": "「e METRO」App 或スルッとQRtto 網站（需註冊會員、用信用卡付款），進出站刷 QR 碼", "good_for": "內容和實體エンジョイエコカード相同，購買後 30 天內選一天使用；不用排隊買卡", "url": "https://subway.osakametro.co.jp/guide/fare/category_digital_tickets/digital_tickets/digital_joshaken.php"}, {"name": "ようおこし30hパス（2026-10-01 新推出）", "price": "1,200 円（大人）／兒童 600 円", "where": "e METRO App 或スルッとQRtto 網站", "good_for": "開始使用後 30 小時內 Osaka Metro 全線無限搭（不含巴士、夢洲站）；下午才到大阪、隔天還要搭車的人最划算", "url": "https://subway.osakametro.co.jp/guide/fare/category_digital_tickets/digital_tickets/digital_joshaken.php"}, {"name": "大阪周遊パス（Osaka Amazing Pass，2026 年度數位版）", "price": "1 日 3,500 円／2 日 5,000 円（只有大人）；大阪伊丹機場版 3,800／5,400 円", "where": "スルッとQRtto 網站（數位 QR 票、信用卡付款）", "good_for": "Osaka Metro＋市巴士＋大阪市內私鐵指定區間無限搭，還能免費進入約 40 處設施（大阪城天守閣、空中庭園展望台、水上巴士等）。一天要跑 3～4 個收費景點才划算，只搭車並不划算。", "url": "https://subway.osakametro.co.jp/guide/fare/category_digital_tickets/digital_tickets/digital_joshaken.php"}, {"name": "ONE KANSAI 大阪スマートアクセスパス", "price": "1,000 円（大人）", "where": "KANSAI MaaS App／網站（購買時要指定使用日）", "good_for": "Osaka Metro 全線＋JR 大阪環狀線等區間一天無限搭，比地鐵一日券還便宜，適合要搭環狀線的日子", "url": "https://subway.osakametro.co.jp/guide/fare/category_digital_tickets/digital_tickets/digital_joshaken.php"}], "images": [{"file": "ticket_img/city_osaka_fare_chart.jpg", "caption": "Osaka Metro 中百舌鳥站：售票機正上方的大型路線圖就是「運賃表」，每站旁的數字是從本站出發的票價；牆上也貼著 820 円一日券的告示。", "credit": "MaedaAkihiko, CC0, https://commons.wikimedia.org/wiki/File:Osaka-metro_Nakamozu-STA_Ticket.jpg"}, {"file": "ticket_img/city_osaka_metro_machine.jpg", "caption": "Osaka Metro 江坂站售票機（2020 年拍攝）：螢幕下方有「日本語 / English / 中文 / 한국어」語言鍵。招牌上站名旁的票價是漲價前的舊價，現行票價請看站內的運賃表。", "credit": "HQA02330, CC BY-SA 4.0, https://commons.wikimedia.org/wiki/File:OM-Esaka-station-ticket-vending-machine.jpg"}], "tips": ["一日券只能搭 Osaka Metro 和大阪城市巴士；搭進直通運轉的阪急、北大阪急行、近鐵區間時，要在下車站另外補票。", "エンジョイエコカード和多數一日券不含夢洲站（萬博會場站，另收加算運賃）。", "梅田、東梅田、西梅田三站之間可以出站轉乘，視為同一趟（有時間限制；用 IC 卡會自動處理）。", "數位票的 QR 碼要在有 QR 讀取口的閘門刷，使用前請確認手機有網路和電量。", "信用卡感應沒有每日扣款上限，搭很多趟的日子請改買一日券。"], "sources": ["https://subway.osakametro.co.jp/guide/fare/fare/price.php", "https://subway.osakametro.co.jp/guide/fare/card_tickets/benri-joshaken.php", "https://subway.osakametro.co.jp/guide/fare/category_digital_tickets/digital_tickets/digital_joshaken.php", "https://subway.osakametro.co.jp/guide/page/contactless_payment.php"]}, {"id": "kyoto-subway", "title": "京都市營地鐵與市巴士：票價與一日券", "intro": "京都市營地鐵（烏丸線、東西線）大人單程 220／260／290／330／360 円，市巴士均一區間 230 円。到 2026 年 10 月這兩者都還不能刷信用卡，請用 IC 卡、現金或一日券；市巴士專用的一日券已在 2023 年 9 月停售。", "steps": [{"text": "看售票處上方的運賃表／路線圖，找出目的地票價（最低 220 円）；售票機可以切換英文、中文介面。", "img": "ticket_img/city_kyoto_machine.jpg", "caption": "京都市營地鐵京都站南側售票處：上方是運賃表和路線圖，售票機旁標示 220（最低票價）；右上角的指標指向「地下鉄・バス1日券」售票處。"}, {"text": "按「きっぷ」→ 選金額 → 投入現金 → 取回車票和找零；IC 卡儲值也在同一台機器（按「チャージ」）。", "img": null, "caption": ""}, {"text": "地下鉄1日券可以直接在各站售票機買（當天有效）；地下鉄・バス1日券則在地鐵站窗口、市巴士・地鐵案內所（京都站前等）購買，也可以在市巴士上向司機買（數量有限，可能賣完）。", "img": null, "caption": ""}, {"text": "一日券第一次使用：搭地鐵時插入閘門會自動印上日期；搭巴士時在下車時把票卡插入運賃箱的讀卡口（或依司機指示出示）。", "img": null, "caption": ""}, {"text": "搭近鐵直通列車經竹田站進出地鐵時，超出一日券範圍的近鐵區間，要在下車站另外補票。", "img": null, "caption": ""}], "passes": [{"name": "地下鉄・バス1日券", "price": "1,100 円（大人）／兒童 550 円", "where": "地鐵各站窗口、市巴士・地鐵案內所、定期券發售處、市巴士營業所、市巴士車內；也可在 KANSAI MaaS 先買數位兌換券（要到京都站前或コトチカ京都案內所換成實體票）", "good_for": "一天搭 5 趟左右就回本（例：巴士 230×3＋地鐵 260×2＝1,210 円）；可搭觀光特急巴士、京都巴士和京阪巴士部分路線（大原、嵐山周邊），還有約 50 處設施優惠", "url": "https://www.city.kyoto.lg.jp/kotsu/page/0000028378.html"}, {"name": "地下鉄1日券", "price": "800 円（大人）／兒童 400 円", "where": "地鐵各站售票機（當天有效）、窗口、案內所", "good_for": "整天只搭地鐵、搭 4 次 220 円以上（或 3 次 290 円以上）時；另有二條城入城費折 100 円等優惠", "url": "https://www.city.kyoto.lg.jp/kotsu/page/0000028376.html"}], "images": [{"file": "ticket_img/city_kyoto_machine.jpg", "caption": "京都市營地鐵京都站南側售票處：上方是運賃表和路線圖，售票機旁標示 220（最低票價）；右上角的指標指向「地下鉄・バス1日券」售票處。", "credit": "MaedaAkihiko, CC0, https://commons.wikimedia.org/wiki/File:Kyoto-Subway_Kyoto-STA_South-Ticket.jpg"}], "tips": ["原本的「バス1日券」（市巴士一日券）已在 2023-09-30 停售、2024-03-31 停用；現在只剩含地鐵的 1,100 円「地下鉄・バス1日券」。", "市巴士 230 円是「均一區間」的票價；開往郊區（如大原、鞍馬方向）的「調整區間」上車要抽整理券、依距離收費。", "京都市府計畫在 2027 年度實施「市民優先價格」，非市民的巴士車資會調到 350～400 円左右；這趟 2026 年 10 月的旅程仍是 230 円。", "11 月賞楓季市巴士非常擁擠，熱門路線（如 100、206 號）常常擠不上車；能搭地鐵、京阪、JR 的路段，先選鐵道。", "持 ICOCA 並在「もえポっ」登記的人，可以申請「地下鉄・バスIC24Hチケット」（指定時間起 24 小時，超過 1,100 円的部分以點數回饋）；需要事先上網登記，一般旅客直接買 1 日券比較簡單。"], "sources": ["https://www.city.kyoto.lg.jp/kotsu/page/0000240757.html", "https://www.city.kyoto.lg.jp/kotsu/page/0000240682.html", "https://www.city.kyoto.lg.jp/kotsu/page/0000019521.html", "https://www.city.kyoto.lg.jp/kotsu/page/0000028378.html", "https://www.city.kyoto.lg.jp/kotsu/page/0000028376.html", "https://www.city.kyoto.lg.jp/kotsu/page/0000351261.html", "https://www.city.kyoto.lg.jp/kotsu/page/0000316038.html", "https://www.city.kyoto.lg.jp/kotsu/page/0000334479.html"]}, {"id": "bus", "title": "日本搭公車通用指南：整理券、運賃表、IC 卡與換零錢", "intro": "日本公車分兩種：市區的「均一運賃」（大阪 210 円、京都 230 円，坐多遠都一樣），和郊區「依距離計費」（要抽整理券）。看懂車門、整理券和車頭的運賃表示器，就能放心搭任何地方的公車。", "steps": [{"text": "看車頭／車側的系統號碼和目的地確認方向，再看車門上的標示，確認從哪個門上車（「入口」「乗車口」）。大阪市巴士、京都市巴士多半是後門上車、下車時在前門付款；", "img": null, "caption": ""}, {"text": "上車：用 IC 卡的話，依車上指示在上車門的讀卡機感應（均一票價、下車付款的大阪市巴士，上車不用刷）；付現金的話，在依距離計費的路線上車時，從整理券機抽一張「整理券」，上面的號碼代表你的上車站。", "img": "ticket_img/city_bus_seiriken.jpg", "caption": "整理券機（左，紅色「整理券」字樣）和運賃箱（右）：在依距離計費的巴士上，上車時抽一張整理券，下車時連同車資一起投入運賃箱（2008 年攝於神奈川中央交通車內）。"}, {"text": "車頭上方的運賃表示器（螢幕）會列出每個整理券號碼目前對應的車資；下車前找到自己的號碼，金額會隨站數增加。", "img": null, "caption": ""}, {"text": "快到站時按下車鈴（「とまります」燈會亮），等車子完全停穩再起身。", "img": null, "caption": ""}, {"text": "付款：IC 卡在運賃箱的 IC 感應區刷一下即可；付現金則把整理券和「剛好的金額」一起投進運賃箱。多數運賃箱不找零，沒有零錢時先用旁邊的兩替口換：硬幣（500/100/50 円）投上方、1,000 円紙鈔投下方，換好零錢再付車資。", "img": "ticket_img/city_bus_farebox.jpg", "caption": "日本路線巴士司機旁的運賃箱：左上是 IC 卡感應區，左下是卡片插入口，右側紫色是兩替（換零錢）機，上方投 500/100/50 円硬幣、下方投 1000 円紙鈔。「NO CHANGE GIVEN」表示投幣付車資不找零。"}, {"text": "使用一日券：下車時把票卡插入運賃箱的卡片插口（第一次使用會印上日期），或依規定出示給司機看。", "img": null, "caption": ""}], "passes": [], "images": [{"file": "ticket_img/city_bus_seiriken.jpg", "caption": "整理券機（左，紅色「整理券」字樣）和運賃箱（右）：在依距離計費的巴士上，上車時抽一張整理券，下車時連同車資一起投入運賃箱（2008 年攝於神奈川中央交通車內）。", "credit": "は095, CC BY-SA 3.0, https://commons.wikimedia.org/wiki/File:交通電業社製運賃箱&整理券機.JPG"}, {"file": "ticket_img/city_bus_farebox.jpg", "caption": "日本路線巴士司機旁的運賃箱：左上是 IC 卡感應區，左下是卡片插入口，右側紫色是兩替（換零錢）機，上方投 500/100/50 円硬幣、下方投 1000 円紙鈔。「NO CHANGE GIVEN」表示投幣付車資不找零。", "credit": "bangdoll from Taipei, Taiwan, CC BY-SA 2.0, https://commons.wikimedia.org/wiki/File:バス運賃箱_2017_(33139447731).jpg"}], "tips": ["兩替（換零錢）機多半只收 1,000 円紙鈔，5,000、10,000 円大鈔通常不能換；上車前先準備零錢或 IC 卡。", "大阪市巴士官方說明：下車時可以用現金、IC 卡或感應式信用卡付款，付現金會找零（實際以車內標示為準）。", "車子行駛中不要走到前門換錢或付款，等車停穩再處理，司機會等你。", "IC 卡餘額不足時，部分巴士可以在運賃箱用 1,000 円紙鈔儲值，或用現金補差額（依車型而定）；最好上車前先確認餘額。", "均一票價的路線不需要整理券；上車時沒看到整理券機，通常就是均一票價。", "京都觀光路線尖峰時段很擠，背包請背在胸前，大件行李建議寄放或宅配，避免影響其他乘客。"], "sources": ["https://citybus-osaka.co.jp/howto", "https://www.city.kyoto.lg.jp/kotsu/page/0000240682.html", "https://www.kotsu.city.nagoya.jp/rp/bus/TRP0000165.htm", "https://www.kotsu.city.nagoya.jp/rp/ticket/TRP0000310.htm"]}, {"id": "osaka-kyoto", "title": "大阪⇄京都：JR 新快速、阪急、京阪、新幹線怎麼付錢", "intro": "大阪到京都有 4 種常用走法。JR 新快速、阪急、京阪都是一般列車，直接刷 ICOCA 等 IC 卡進站就好，不用買票也不用訂位；只有新幹線（新大阪⇄京都）不能單靠 IC 卡，要先買票或用 smartEX。下面依「怎麼付」與「什麼時候選哪條」整理（2026 年秋天、成人單程）。", "steps": [{"text": "JR 新快速（大阪／新大阪⇄京都）：用 IC 卡感應進站，車資 580 円（IC 卡與紙票同價），大阪→京都約 29 分、新大阪→京都約 24 分，白天每 15 分一班。在大阪站搭往「京都・米原」方向的新快速（看月台看板，多在 8 號月台）。", "img": null, "caption": ""}, {"text": "JR 要注意的地方：①12 節編成的 9 號車是付費座位「Aシート」（部分班次另有付費座位「うれシート」），沒買座位券請坐其他車廂；②同一月台也會停特急サンダーバード、はるか，它們全車指定席、要另買特急券，刷 IC 卡上車會被要求補票。", "img": null, "caption": ""}, {"text": "阪急（大阪梅田⇄烏丸／京都河原町）：刷 IC 卡，410 円；特急白天約 10 分一班，到烏丸 41 分、到京都河原町 43 分。烏丸站地下可直接轉京都市營地鐵「四条」站（烏丸線）。4 號車 PRiVACE 是付費座位（500 円，需預約），一般車廂不用加錢。", "img": "timg/hankyu_ticket_machine.jpg", "caption": "阪急嵐山站的售票機與票價圖（中間粉紅色機台可加值 ICOCA）。搭阪急一般列車直接刷 IC 卡即可。"}, {"text": "住天下茶屋的走法：天下茶屋站搭堺筋線往「北千里／高槻市／正雀」方向的直通車到「淡路」，同站轉阪急特急往京都河原町，天下茶屋→烏丸約 58 分、全程 700 円（地鐵＋阪急分開計價，刷同一張 IC 卡自動扣）。", "img": null, "caption": ""}, {"text": "京阪（淀屋橋／北浜⇄祇園四条／三条／出町柳）：刷 IC 卡。2025/10/1 起調漲：淀屋橋→祇園四条・三条 490 円、→出町柳 550 円；特急約 10–13 分一班，淀屋橋→祇園四条約 50 分。從天下茶屋可搭堺筋線到北浜直接轉京阪。6 號車（部分班次 5・6 號車）是付費的プレミアムカー（淀屋橋⇄出町柳 500 円），可在月台售票機用信用卡或 ICOCA 購買。", "img": null, "caption": ""}, {"text": "新幹線（新大阪⇄京都）：一般 IC 卡不能直接刷新幹線閘門（除非事先在 smartEX 綁定）。在新大阪站的綠色「みどりの券売機」或 JR 東海新幹線售票機選「新幹線」→ 京都 →「自由席」，會拿到「乗車券＋新幹線自由席特急券」，合計 1,450 円（指定席：ひかり・こだま 2,870 円、のぞみ 3,080 円）。所有のぞみ・ひかり・こだま都停京都，約 14 分。", "img": "timg/jr_green_machine.jpg", "caption": "JR 西日本「みどりの券売機」（綠色指定席售票機）：上方寫著「新幹線・在来線特急／乗車券（指定席・自由席）」，可用現金、信用卡。"}, {"text": "新幹線自由席車廂：のぞみ只有 1・2 號車（2025/3/15 起 3 號車改為指定席），ひかり 1–5 號車，こだま 1–7 號車（部分班次 13–15 號車也是自由席）。月台地上有車廂號碼與「自由席」標示，照著排隊。", "img": null, "caption": ""}, {"text": "從地下鐵轉新幹線：在御堂筋線新大阪站出閘（IC 卡扣地鐵車資），跟著「JR線／新幹線」指標走到新幹線改札，把乗車券和特急券 2 張疊在一起插入閘門。含買票請抓 10 分鐘以上。"}, {"text": "smartEX（選用）：在 smartEX 網站／App（有英文介面）登錄信用卡並綁定 IC 卡後，新大阪→京都 自由席同樣 1,450 円，可直接用那張 IC 卡刷新幹線閘門，不必排隊買票。", "img": null, "caption": ""}], "passes": [], "images": [{"file": "timg/hankyu_ticket_machine.jpg", "caption": "阪急嵐山站的售票機與票價圖（中間粉紅色機台可加值 ICOCA）。搭阪急一般列車直接刷 IC 卡即可。", "credit": "MaedaAkihiko, CC0, https://commons.wikimedia.org/wiki/File:Hankyu_Arashiyama-STA_Ticket.jpg"}, {"file": "timg/jr_green_machine.jpg", "caption": "JR 西日本「みどりの券売機」（綠色指定席售票機）：上方寫著「新幹線・在来線特急／乗車券（指定席・自由席）」，可用現金、信用卡。", "credit": "Inaji, CC BY-SA 3.0, https://commons.wikimedia.org/wiki/File:JR西日本みどりの券売機.JPG"}], "tips": ["去京都站、東福寺、伏見稻荷（JR 奈良線）或嵐山（JR 嵯峨野線）：選 JR 新快速。", "去四条烏丸、錦市場、河原町：選阪急，最便宜（410 円）而且直達市中心。", "去祇園、八坂神社、清水寺、南禪寺：選京阪，在祇園四条下車。", "住天下茶屋：往烏丸／河原町用堺筋線→淡路轉阪急，往祇園用堺筋線→北浜轉京阪，都只轉一次。", "新幹線只有「人已經在新大阪、又趕時間」才值得：從梅田、なんば出發算上轉乘時間，通常只比新快速快 0–5 分，卻貴 870 円以上。", "以上私鐵優惠票（如 ONE KANSAI 京都満喫3wayパス、KYOTO-OSAKA SIGHTSEEING PASS）見「票券／周遊券」一節；單純來回直接刷 IC 卡最簡單。"], "sources": ["https://transit.yahoo.co.jp/", "https://tabiris.com/archives/jrwest-fare2025/", "https://www.keihan.co.jp/traffic/unchinkaitei_2025/", "https://www.keihan.co.jp/travel/en/trains/premium-car/", "https://www.hankyu.co.jp/privace/en/", "https://shinkansen.tabiris.com/kyoto_osaka.html", "https://trafficnews.jp/post/529951", "https://tabiris.com/archives/jiyuseki-gosha", "https://news.mynavi.jp/article/20190227-aseat/", "https://smart-ex.jp/en/"]}, {"id": "hankyu-keihan", "title": "阪急・京阪・北大阪急行：刷 IC 卡就好，指定席車廂可選加購", "intro": "去箕面、勝尾寺、嵐山（阪急）、伏見十石舟（京阪中書島）、有馬（阪急→地鐵→神戶電鐵）都是一般列車，直接用 ICOCA 等 IC 卡刷卡就能搭，連「特急」也不用加錢。只有想坐阪急 PRiVACE 或京阪プレミアムカー這種指定席車廂時，才需要加購座位券。", "steps": [{"text": "一般搭乘：IC 卡在閘門感應進出即可；餘額不足時用車站售票機或精算機加值（可選英文）。", "img": "ticket_img/hankyu_ticket_machine.jpg", "caption": "阪急嵐山站的售票機與上方票價圖（中間粉紅色機台可加值 ICOCA）。搭阪急一般列車直接刷 IC 卡進站即可，不需要買票。"}, {"text": "用數位優惠票（例如 阪急1dayパス、北急・モノレール京都おでかけきっぷ）：當天在手機按「開始使用」，走有 QR 標示的閘門感應 QR 碼。", "img": null, "caption": ""}, {"text": "阪急 PRiVACE（選購）：只在阪急京都線特急等列車的第 4 節車廂（從大阪梅田方向數），座位券一律 500 円，需事先在 PRiVACE 網站預約，車資另刷 IC 卡。", "img": null, "caption": ""}, {"text": "京阪プレミアムカー（選購）：特急的 6 號車（金色車門），淀屋橋－出町柳間 500 円、短程 400 円。可在月台／大廳的「プレミアムカー無現金售票機」用信用卡或 ICOCA 購買（可買接下來 5 班），網路購買僅日文。", "img": null, "caption": ""}, {"text": "伏見十石舟：京阪淀屋橋／京橋搭特急到中書島（約 40 分），步行約 5 分到十石舟乘船處。", "img": null, "caption": ""}, {"text": "箕面／勝尾寺：阪急梅田→石橋阪大前轉箕面線到箕面；勝尾寺則搭御堂筋線直通的北大阪急行到「箕面萱野」，再轉巴士（巴士車資另付，可刷 IC 卡）。", "img": null, "caption": ""}, {"text": "有馬溫泉（電車）：阪急神戶三宮→地鐵三宮站搭西神・山手線直通北神線到谷上→神戶電鐵到有馬口轉有馬溫泉；全程刷 IC 卡即可。", "img": null, "caption": ""}], "passes": [], "images": [{"file": "ticket_img/hankyu_ticket_machine.jpg", "caption": "阪急嵐山站的售票機與上方票價圖（中間粉紅色機台可加值 ICOCA）。搭阪急一般列車直接刷 IC 卡進站即可，不需要買票。", "credit": "MaedaAkihiko, CC0, https://commons.wikimedia.org/wiki/File:Hankyu_Arashiyama-STA_Ticket.jpg"}], "tips": ["例：京阪 淀屋橋→出町柳 車資 550 円（2025/10/1 調漲）＋プレミアムカー 500 円＝1,050 円；持京阪 Pass 只要付 500 円。", "PRiVACE 與プレミアムカー都是「想坐得舒服」才需要，平常搭特急不用加錢。", "阪急 太閤の湯クーポン 只能走「神戶三宮→地鐵三宮」路線，不能經新開地。", "2020 年起北神急行已併入神戶市營地鐵（北神線），車票不用分開買。"], "sources": ["https://www.hankyu.co.jp/privace/en/", "https://www.keihan.co.jp/travel/en/trains/premium-car/", "https://www.hankyu.co.jp/en/ticket/index.html", "https://www.hankyu.co.jp/ticket/otoku/014158.html", "https://www.hankyu.co.jp/ticket/otoku/014066.html"]}, {"id": "online-booking", "title": "網路訂票與取票：JR-WEST 線上訂位、smartEX、嵯峨野小火車", "intro": "不想在售票機前排隊，可以先在網路上訂位：JR 西日本系統（e5489／外國人用的 JR-WEST ONLINE TRAIN RESERVATION）訂的票要在綠色售票機取紙本票；東海道新幹線專用的 smartEX 則可以綁 IC 卡或用 QR 票直接進站，不用取票。", "steps": [{"text": "JR 西日本線上訂位：在 JR おでかけネット／JR-WEST ONLINE TRAIN RESERVATION 註冊並用信用卡訂位（一般為乘車日 1 個月前 10:00 起）。新幹線、特急ひだ／しなの／はるか都能訂。", "img": null, "caption": ""}, {"text": "取票：到 JR 西日本綠色售票機選語言 →「領取預約車票（Receive reserved ticket）」→「JR-WEST ONLINE TRAIN RESERVATION」（或 e5489）。", "img": "ticket_img/jr_green_machine.jpg", "caption": "線上訂的 JR 西日本車票，也是在這台綠色售票機領取。"}, {"text": "插入訂位時用的那張實體信用卡（虛擬卡不行），或掃描 email 裡的 QR code／輸入預約號碼，再輸入 4 位數密碼，機器就會吐出乘車券＋特急券。", "img": null, "caption": ""}, {"text": "一定要在上車前取票，沒取票就上車要在車上重買全票。", "img": null, "caption": ""}, {"text": "smartEX（東海道・山陽新幹線）：用手機註冊並登錄信用卡，可再綁定 ICOCA 等 IC 卡（Welcome Suica 等外國旅客卡也可以），訂好位後直接用那張 IC 卡刷新幹線閘門即可，票價從信用卡扣，不扣卡內餘額。", "img": null, "caption": ""}, {"text": "smartEX 也可以用「QR-Ticket」：在 App「My Trips」顯示 QR 碼，在有 QR 標誌的新幹線閘門感應；從 JR 在來線轉乘時先感應 QR 再刷 IC 卡。過閘時記得拿閘門吐出的「座位資訊」小票。", "img": null, "caption": ""}, {"text": "smartEX 想要紙本票：到 JR 東海／JR 西日本車站售票機掃描取票 QR 碼或輸入 16 位取票碼＋登入密碼（窗口只能用 16 位碼）。", "img": null, "caption": ""}, {"text": "嵯峨野小火車（トロッコ列車）：在嵯峨野観光鉄道官網選日期、區間、座位，用信用卡付款，當天在 My Page 顯示 E-ticket 的 QR 碼給站務員看即可上車。乘車日 1 個月前開賣，楓葉季很快賣完。", "img": null, "caption": ""}], "passes": [], "images": [], "tips": ["smartEX 比在窗口買便宜約 200 円，而且可以在發車前免費改班次。", "smartEX 綁定的 IC 卡要在發車前用同一張卡進站；同一時間只能有一張卡對應一筆行程。外國旅客 IC 卡（Welcome Suica 等）有 28 天效期，過期就無法用來搭車。", "JR-WEST ONLINE 的機器領票時間約 4:30–23:20；若用外國人專用優惠票，可能需要在機器上刷有 IC 晶片的護照。", "嵯峨野小火車當天票在トロッコ嵯峨站約 8:35、トロッコ嵐山站約 8:50、トロッコ亀岡站約 9:10 起現場先到先買；2026 年是現行車輛最後一季（2027 春換新車）。", "保津川遊船從亀岡出發：建議小火車搭到トロッコ亀岡（或 JR 嵯峨野線到亀岡），坐遊船回嵐山。"], "sources": ["https://www.jr-odekake.net/", "https://www.westjr.co.jp/global/en/howto/train-reservation/receive/", "https://smart-ex.jp/", "https://smart-ex.jp/en/entraining/iccard/", "https://smart-ex.jp/en/entraining/qr/", "https://smart-ex.jp/en/entraining/ticket/place/", "https://www.sagano-kanko.co.jp/ticket/"]}, {"id": "passes", "title": "2026 年秋天值得考慮的票券／周遊券", "intro": "重要變化：JR「關西地區鐵路周遊券（Kansai Area Pass）」官網已公告 2026/9/30 停售，這趟（10/3 起）買不到了。現在多數私鐵優惠票都是手機數位票（QR 碼過閘），需要信用卡在網路上買。下面依你的一日遊行程挑出比較划算的選項；如果只是單純來回，直接刷 ICOCA 通常最簡單。", "steps": [], "passes": [{"name": "高野山・世界遺産デジタルきっぷ（南海）", "price": "なんば出發：只含車資 3,980 円；含去程特急こうや特急券 4,910 円（紙本版 4,210／5,200 円）", "where": "南海官網數位票（手機＋信用卡；當天購買到 15:00），QR 碼過閘", "good_for": "高野山：南海來回車資＋纜車＋山上南海りんかん巴士 2 日券＋寺院／餐飲優惠券，連續 2 天有效", "url": "https://www.nankai.co.jp/traffic/digital/koyasan.html"}, {"name": "高野山おでかけきっぷ（阪急版）", "price": "4,400 円（1 日）", "where": "スルッとQRtto 網站（數位票）；2026/11/30 前可用", "good_for": "高野山：阪急全線＋大阪地鐵全線＋南海 難波－高野山＋山上巴士 1 日乘到飽；特急こうや需另購特急券", "url": "https://www.hankyu.co.jp/ticket/otoku/014071.html"}, {"name": "有馬温泉 太閤の湯クーポン（阪急版）", "price": "3,250 円（含太閤の湯入館券）", "where": "スルッとQRtto 網站（https://surutto-qrtto.com），僅限信用卡", "good_for": "有馬溫泉：阪急全線＋神戶市營地鐵 三宮－新神戶－谷上（原北神急行）＋神戶電鐵 谷上－有馬溫泉 1 日乘到飽＋太閤の湯；10/13 太閤の湯休館日不能用", "url": "https://www.hankyu.co.jp/ticket/otoku/014066.html"}, {"name": "北急・モノレール京都おでかけきっぷ（2026 年後期）", "price": "1,500 円（1 日）", "where": "スルッとQRtto 網站（數位票），2026/9/11–12/20", "good_for": "箕面／勝尾寺：阪急寶塚線・京都線（含箕面、嵐山支線）＋北大阪急行全線＋大阪單軌電車 1 日乘到飽（勝尾寺巴士另付）；也能同時去嵐山", "url": "https://www.hankyu.co.jp/ticket/otoku/014158.html"}, {"name": "京都・嵐山1dayパス（阪急版，2026 秋季）", "price": "1,400 円（1 日）", "where": "スルッとQRtto 網站（數位票），2026/10/1–12/20", "good_for": "嵐山：阪急全線＋嵐電全線＋京都巴士嵐山周邊（大覺寺、清滝等）", "url": "https://www.hankyu.co.jp/ticket/otoku/014168.html"}, {"name": "ONE KANSAI 京都満喫3wayパス", "price": "1,800 円（1 日）", "where": "KANSAI MaaS App／網站（數位票，乘車日 1 個月前起售）", "good_for": "嵐山＋伏見同一天：阪急京都線（含嵐山）、京阪（淀屋橋－出町柳、中書島－宇治）、JR（大阪－京都、京都－嵯峨嵐山）都能搭", "url": "https://www.hankyu.co.jp/ticket/otoku/013943.html"}, {"name": "阪急1dayパス", "price": "1,300 円（1 日）", "where": "スルッとQRtto 網站（數位票，信用卡）", "good_for": "一天內多段搭阪急（例如梅田→箕面＋梅田→嵐山）", "url": "https://www.hankyu.co.jp/ticket/otoku/013812.html"}, {"name": "KYOTO-OSAKA SIGHTSEEING PASS（京阪）", "price": "1 日 1,650 円／24 小時 1,850 円", "where": "京阪官網數位票（QR 碼過閘）或指定銷售點；外國旅客用", "good_for": "伏見十石舟：大阪（淀屋橋）－中書島來回＋伏見稻荷、宇治、京都市區；プレミアムカー需另付 500 円", "url": "https://www.keihan.co.jp/travel/en/trains/passes-for-visitors-to-japan/kyoto-osaka.html"}, {"name": "JR 西日本 QR2day パス", "price": "4,000 円（連續 2 天）", "where": "只在 KANSAI MaaS App 販售（車站不賣）", "good_for": "JR 嵯峨野線（嵯峨嵐山、亀岡）＋京都、神戶、奈良等關西廣域 JR 一般列車，2 天乘到飽；新幹線不可，特急需另購特急券", "url": "https://www.jr-odekake.net/ticket/tokutoku/jrwest_qr2days/"}, {"name": "Kansai Mini Pass（JR 西日本，外國旅客）", "price": "3,000 円（3 天）", "where": "海外旅行社或 JR-WEST 官方線上購買，來日後到 JR 車站換票（需護照）", "good_for": "京都、大阪、神戶、奈良間 JR 快速／普通列車；嵯峨野線是否包含請看官網路線圖", "url": "https://www.westjr.co.jp/travel-information/en/tickets-passes/jrwest-rail-pass/kansaimini/"}, {"name": "KINTETSU RAIL PASS 5day", "price": "4,900 円（1day 1,900 円／2day 3,700 円）", "where": "近鉄官網數位票（購買後即可用）", "good_for": "近鉄全線 5 天；不含特急，搭特急要另購特急券。", "url": "https://www.kintetsu.co.jp/foreign/english/ticket/krp_5day.html"}, {"name": "JAPAN RAIL PASS（全國）", "price": "7 日 50,000 円（官網標示；有報導 2026/10 起調漲，請以購買時官網價格為準）", "where": "JAPAN RAIL PASS 官網或旅行社", "good_for": "這趟以大阪為基地的一日遊不划算；只有密集長途移動才值得。搭のぞみ還要另買特別券", "url": "https://japanrailpass.net/en/"}], "images": [], "tips": ["Kansai Area Pass：JR 西日本官網註明「Sales ended as of September 30, 2026」，9/30 前已買的仍可在有效期間內使用。", "KANSAI RAILWAY PASS／LITE 的 2026 上半年版（3/25–9/30 售）已結束，下一期是否推出請看 スルッとKANSAI 官網。", "スルッとQRtto 與 KANSAI MaaS 都需先註冊帳號、用信用卡付款；使用當天按「開始使用」後才顯示 QR 碼，凌晨 3:00 起算新的一天。", "數位票只能走有 QR 讀取器的閘門（閘門上有 QR 標示），一般閘門不能用。", "賞楓高峰（11 月上旬起）嵐山、伏見、箕面人潮多，數位票可省下排隊買票的時間。"], "sources": ["https://www.westjr.co.jp/travel-information/en/tickets-passes/jrwest-rail-pass/kansai/", "https://www.westjr.co.jp/travel-information/en/tickets-passes/jrwest-rail-pass/kansaimini/", "https://www.jr-odekake.net/ticket/tokutoku/jrwest_qr2days/", "https://www.westjr.co.jp/press/article/items/260225_00_press_JRWESTQR2daypass_1.pdf", "https://www.nankai.co.jp/traffic/digital/koyasan.html", "https://www.hankyu.co.jp/ticket/otoku/index.html", "https://www.keihan.co.jp/travel/en/trains/passes-for-visitors-to-japan/kyoto-osaka.html", "https://www.kintetsu.co.jp/foreign/english/ticket/", "https://japanrailpass.net/en/purchase/price/", "https://www.surutto.com/kansai_rwpl/en/"]}, {"id": "nankai", "title": "南海電鐵：去高野山的特急こうや座位", "intro": "從なんば到高野山，普通車資可以直接刷 ICOCA（或用數位票）；但「特急こうや／りんかん」是全車指定席，一定要另買特急券。也可以不搭特急，搭急行到橋本再轉車，就不需要特急券。", "steps": [{"text": "最省事：買「高野山・世界遺産デジタルきっぷ」含特急券版（4,910 円），在購買頁面直接選去程特急こうや的車次與座位（最多可改 2 次）。回程特急券要另買。", "img": null, "caption": ""}, {"text": "不用優惠票：先上「南海 特急チケットレスサービス」（有英文、繁中，信用卡付款）訂特急座位，比窗口便宜 150 円，上車只要出示手機畫面；車資另外刷 ICOCA 或信用卡感應進站。", "img": null, "caption": ""}, {"text": "現場買：到南海なんば站 3F（或 2F）找「特急券・指定券（Reservation Tickets）」窗口，或旁邊粉紅色的特急券售票機，選日期、車次、座位，付款取得特急券。", "img": "ticket_img/nankai_namba_tickets.jpg", "caption": "南海なんば站 3F 北改札口：左邊是一般售票機（きっぷうりば），右邊是「特急券・指定券」窗口（Reservation Tickets），買特急こうや座位就在這裡。"}, {"text": "進站：用 ICOCA（或數位票 QR）過閘；紙本特急券不用插閘門，收好給車掌查驗即可。", "img": null, "caption": ""}, {"text": "極樂橋站下車後轉高野山纜車上山，再轉南海りんかん巴士到奧之院、金剛峯寺等（數位票含 2 日巴士）。", "img": null, "caption": ""}], "passes": [], "images": [{"file": "ticket_img/nankai_namba_tickets.jpg", "caption": "南海なんば站 3F 北改札口：左邊是一般售票機（きっぷうりば），右邊是「特急券・指定券」窗口（Reservation Tickets），買特急こうや座位就在這裡。", "credit": "そらみみ, CC BY-SA 3.0, https://commons.wikimedia.org/wiki/File:Ticket_machine_corner_of_Nankai_Namba_Station.jpg"}], "tips": ["2026/4/1 起南海特急料金調整：なんば－極楽橋 特急こうや 1,100 円（小孩 550 円）；用チケットレス購買便宜 150 円；上車後才補買加收 300 円。", "特急こうや每天班次不多，賞楓季週末容易客滿，建議提早在網路上訂位。", "一般售票機只賣車資，特急券要在特急券窗口、粉紅色特急券售票機或網路買。", "數位票當天購買只到 15:00，建議前一晚買好。"], "sources": ["https://www.nankai.co.jp/en_railway/traffic/express/kouya.html", "https://www.nankai.co.jp/news/260122.html", "https://www.nankai.co.jp/traffic/newticketless/about.html", "https://www.club-nankai.jp/traffic/ticketless/en/", "https://www.nankai.co.jp/traffic/digital/koyasan.html"]}];
const IMG = {"ticket_img/city_osaka_touch_gate.jpg": "timg/city_osaka_touch_gate.jpg", "ticket_img/city_ic_card_tap.jpg": "timg/city_ic_card_tap.jpg", "ticket_img/city_osaka_fare_chart.jpg": "timg/city_osaka_fare_chart.jpg", "ticket_img/city_osaka_metro_machine.jpg": "timg/city_osaka_metro_machine.jpg", "ticket_img/city_kyoto_machine.jpg": "timg/city_kyoto_machine.jpg", "ticket_img/city_bus_seiriken.jpg": "timg/city_bus_seiriken.jpg", "ticket_img/city_bus_farebox.jpg": "timg/city_bus_farebox.jpg", "timg/hankyu_ticket_machine.jpg": "timg/hankyu_ticket_machine.jpg", "timg/jr_green_machine.jpg": "timg/jr_green_machine.jpg", "ticket_img/hankyu_ticket_machine.jpg": "timg/hankyu_ticket_machine.jpg", "ticket_img/jr_green_machine.jpg": "timg/jr_green_machine.jpg", "ticket_img/nankai_namba_tickets.jpg": "timg/nankai_namba_tickets.jpg"};
const QUICK = ["最省事：iPhone 錢包加 ICOCA 或 Suica（台灣 iPhone 8 以上可用，免押金），地鐵、私鐵、多數巴士都能刷。", "Osaka Metro、阪急、阪神全站可以直接用信用卡感應進站；京都地鐵和京都市巴士還不行，京阪也不行。", "搭新幹線、特急、高野山特急こうや、近鐵ひのとり要另外買指定席／特急券，IC 卡只付一般車資。", "JR 關西廣域周遊券（Kansai Area Pass）9/30 已停賣；高野山、有馬、箕面、嵐山的套票多半改成數位票，要用信用卡在網站買。", "票價與營運隨時可能調整，出發前請以官網為準；資料查核日 2026/10/3。"];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fig = (f, cap, credit) => IMG[f] ? `<figure><img src="${IMG[f]}" alt="${esc(cap)}" loading="lazy"><figcaption>${esc(cap)}${credit ? '・'+esc(credit) : ''}</figcaption></figure>` : '';
const creditOf = (s, f) => (s.images||[]).find(i => i.file===f)?.credit || '';
document.getElementById('toc').innerHTML = T.map(s => `<a href="#${esc(s.id)}">${esc(s.title)}</a>`).join('');
document.getElementById('main').innerHTML =
  (QUICK.length ? `<div class="quick"><h2>先看這裡</h2><ul>${QUICK.map(q=>`<li>${esc(q)}</li>`).join('')}</ul></div>` : '') +
  T.map(s => {
    const used = new Set((s.steps||[]).map(x=>x.img).filter(Boolean));
    const extra = (s.images||[]).filter(i => !used.has(i.file) && IMG[i.file]);
    return `<section class="sec" id="${esc(s.id)}">
      <h2>${esc(s.title)}</h2>
      ${s.intro ? `<p class="intro">${esc(s.intro)}</p>` : ''}
      ${(s.steps||[]).length ? `<div class="h3">步驟</div><ol class="steps">${s.steps.map(x => `<li><div class="stx">${esc(x.text)}${x.img ? fig(x.img, x.caption||'', creditOf(s, x.img)) : ''}</div></li>`).join('')}</ol>` : ''}
      ${extra.length ? `<div class="gallery">${extra.map(i => fig(i.file, i.caption, i.credit)).join('')}</div>` : ''}
      ${(s.passes||[]).length ? `<div class="h3">票券與票價</div><div class="tkwrap"><table><thead><tr><th>票券</th><th>票價</th><th>哪裡買</th><th>適合</th></tr></thead><tbody>${s.passes.map(p => `<tr><td>${p.url ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.name)} ↗</a>` : esc(p.name)}</td><td class="pr">${esc(p.price)}</td><td>${esc(p.where)}</td><td>${esc(p.good_for)}</td></tr>`).join('')}</tbody></table></div>` : ''}
      ${(s.tips||[]).length ? `<ul class="tips">${s.tips.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>` : ''}
      ${(s.sources||[]).length ? `<div class="src">來源：${s.sources.map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u.replace(/^https?:\/\//,'').slice(0,60))}</a>`).join('、')}</div>` : ''}
    </section>`;
  }).join('');
</script>
